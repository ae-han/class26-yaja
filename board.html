<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2학년 6반 야자 · 스마트 칠판</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,"Malgun Gothic",sans-serif;background:#f3f5f7;color:#222}header{text-align:center}h1{font-size:30px;margin:4px}#clock{font-size:22px;font-weight:bold;margin:6px}#cip{background:#252525;color:white;border-radius:8px;padding:10px;font-size:20px;font-weight:bold}nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:10px}button,a,input{font:inherit;min-height:42px;padding:8px 12px;border:1px solid #adb5bd;border-radius:7px;background:white;color:#222}button{cursor:pointer}button:disabled{opacity:.5}#connection{padding:10px;border:2px solid #b07808;background:#fff3cd;border-radius:8px;text-align:center;font-weight:bold;line-height:1.5}#connection.fresh{border-color:#2a8150;background:#e3f4e8}#saveStatus{text-align:center;font-size:14px;margin:6px}#grid{max-width:1480px;margin:12px auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.seat{min-height:100px;padding:8px;border:2px solid #a9b7b1;border-radius:9px;background:#e1f2e6;text-align:center;overflow-wrap:break-word}.seat.absent{background:#ffe1e1;border-color:#d84141}.seat.unknown{background:#eee;border-color:#aaa}.seat.disabled{background:#d7d7d7;color:#777}.number{font-size:15px}.name{font-size:24px;font-weight:bold;margin:4px}.reason{font-size:16px;font-weight:bold;line-height:1.4}footer{text-align:center;font-size:14px;line-height:1.5}#manual{display:none;background:#fff3cd;padding:10px}noscript{display:block;background:#ffe1e1;padding:20px}@media(min-height:850px){.seat{min-height:115px}}@media(max-width:650px){body{padding:6px}h1{font-size:24px}#grid{gap:4px}.seat{padding:4px;min-height:85px}.name{font-size:17px}.reason{font-size:12px}.number{font-size:12px}}
</style>
<style>
@media(min-width:900px){#grid{height:calc(100vh - 295px);min-height:420px;grid-template-rows:repeat(6,minmax(0,1fr))}.seat{min-height:0;padding:4px}.name{font-size:23px;margin:2px}.reason{font-size:14px;line-height:1.2}.number{font-size:12px}}
@media(min-width:900px) and (max-height:800px){body{padding:6px}h1{font-size:24px}#clock{font-size:18px;margin:4px}#cip{font-size:17px;padding:7px}nav{margin:6px}button,a,input{min-height:36px;padding:6px 10px}#connection{padding:6px}#saveStatus{margin:4px}#grid{height:calc(100vh - 250px);margin:8px auto}.name{font-size:20px}.reason{font-size:12px}}
</style>
<header><h1>2학년 6반 야자 관리</h1><div id="clock"></div><div id="cip">시간 확인 중</div></header>
<nav aria-label="화면 도구"><button id="refresh">지금 갱신</button><button id="fullscreen">전체 화면</button><label>조회 날짜 <input id="date" type="date"></label><button id="today">오늘</button><button id="download" disabled>오프라인 파일 저장</button><a href="https://ae-han.github.io/class26-yaja/">신청 화면</a></nav>
<div id="connection" role="status" aria-live="polite">자료를 불러오는 중입니다. 아직 좌석 상태를 확인하지 못했습니다.</div>
<div id="saveStatus">처음에는 인터넷에 연결해 자료를 한 번 받아주세요.</div>
<noscript>브라우저의 JavaScript를 켜주세요. 켤 수 없으면 최신 크롬 또는 엣지에서 열어주세요.</noscript>
<div id="grid" aria-label="좌석표"></div>
<footer>빨강: 현재 CIP 불참 · 초록: 현재 CIP 불참 신청 없음 · 회색: 자료 확인 전<br>지난 자료를 표시할 때는 위쪽의 마지막 확인 시각을 확인해주세요. 새 신청은 연결이 복구된 후 반영됩니다.</footer>
<p id="manual">이 기기는 화면 자동 보관을 지원하지 않습니다. 위의 ‘오프라인 파일 저장’으로 받은 파일을 열면 연결 없이 볼 수 있습니다.</p>
<script id="saved-data" type="application/json">null</script>
<script>
(function () {
'use strict';
var students = {

    1: "강주형",
    2: "고진용",
    3: "권율",
    4: "X",

    5: "김경태",
    6: "김용준",
    7: "김제겸",
    8: "김지효",
    9: "김하윤",
    10: "김현성",

    11: "목지안",
    12: "백시우",
    13: "서재훈",
    14: "서지후",
    15: "성무빈",
    16: "송재호",
    17: "신예준",
    18: "신준모",
    19: "양서희",
    20: "오태진",

    21: "윤수찬",
    22: "윤정연",
    23: "윤하유",
    24: "이지성",
    25: "이지혁",
    26: "이지후",
    27: "전윤우",
    28: "정준기",
    29: "정하율",
    30: "조동현",

    31: "차이한",
    32: "최담호",
    33: "최유진",
    34: "최태웅",

    35: "X",
    36: "X"
};
var disabled = [4,35,36];
var base = 'https://firestore.googleapis.com/v1/projects/yaja2-6/databases/(default)/documents';
var cacheKey = 'class26-yaja-board-v1';
var data = null, busy = false, timer = null, failures = 0, live = false, storageOK = true;
var selected = korea().date, followToday = true, lastToday = selected, lastCip = cipAt(korea()), shellReady = false;
function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : String(n); }
// UTC arithmetic also works on older boards without Intl timeZone support.
function korea(value) {
 var d = new Date((value === undefined ? Date.now() : value) + 9*3600000);
 return {date:d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()),hour:d.getUTCHours(),minute:d.getUTCMinutes(),second:d.getUTCSeconds(),weekday:d.getUTCDay()};
}
function cipAt(t) { var m=t.hour*60+t.minute; return m>=1010&&m<1060?1:m>=1120&&m<1200?2:m>=1210&&m<1260?3:null; }
function stamp(ms) { var t=korea(ms);return t.date+' '+pad(t.hour)+':'+pad(t.minute)+':'+pad(t.second); }
function valid(x) { return x && x.version===1 && Array.isArray(x.absence) && Array.isArray(x.recurring) && typeof x.savedAt==='number' && x.savedAt>0; }
function loadSaved() {
 var candidates=[];
 try { candidates.push(JSON.parse(el('saved-data').textContent)); } catch(e) {}
 try { candidates.push(JSON.parse(localStorage.getItem(cacheKey))); } catch(e) { storageOK=false; }
 candidates.forEach(function(x){if(valid(x)&&(!data||x.savedAt>data.savedAt)) data=x;});
}
function decode(v) {
 if('stringValue' in v)return v.stringValue;
 if('integerValue' in v)return Number(v.integerValue);
 if('doubleValue' in v)return Number(v.doubleValue);
 if('timestampValue' in v)return v.timestampValue;
 if('booleanValue' in v)return v.booleanValue;
 if(v.arrayValue)return (v.arrayValue.values||[]).map(decode);
 return null;
}
function record(d) {
 var out={id:d.name.split('/').pop()};
 Object.keys(d.fields||{}).forEach(function(k){out[k]=decode(d.fields[k]);});
 return out;
}
function request(url, body) {
 return new Promise(function(resolve,reject){
  var xhr=new XMLHttpRequest();xhr.open(body?'POST':'GET',url,true);xhr.timeout=15000;
  if(body)xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){if(xhr.status!==200){reject(new Error('HTTP '+xhr.status));return;}try{resolve(JSON.parse(xhr.responseText));}catch(e){reject(e);}};
  xhr.onerror=function(){reject(new Error('network'));};xhr.ontimeout=function(){reject(new Error('timeout'));};xhr.send(body?JSON.stringify(body):null);
 });
}
function readAll(name, token, rows) {
 var url=base+'/'+name+'?pageSize=1000&mask.fieldPaths=number&mask.fieldPaths=date&mask.fieldPaths=cips&mask.fieldPaths=weekdays&mask.fieldPaths=reason&mask.fieldPaths=updatedAt';
 if(token)url+='&pageToken='+encodeURIComponent(token);
 return request(url).then(function(page){
  if(!page || page.error || (page.documents!==undefined&&!Array.isArray(page.documents)))throw new Error('invalid response');
  var all=(rows||[]).concat((page.documents||[]).map(record));
  return page.nextPageToken?readAll(name,page.nextPageToken,all):all;
 });
}
function readDate(date) {
 return request(base+':runQuery',{structuredQuery:{from:[{collectionId:'absence'}],where:{fieldFilter:{field:{fieldPath:'date'},op:'EQUAL',value:{stringValue:date}}},select:{fields:['number','date','cips','reason','updatedAt'].map(function(name){return{fieldPath:name};})}}}).then(function(rows){
  if(!Array.isArray(rows))throw new Error('invalid query');
  return rows.filter(function(r){if(r.error)throw new Error('query failed');return !!r.document;}).map(function(r){return record(r.document);});
 });
}
function schedule() { var interval=cipAt(korea())?60000:300000;clearTimeout(timer);timer=setTimeout(sync,Math.min(300000,interval*Math.pow(2,Math.min(failures,3)))); }
function sync() {
 if(busy)return;
 busy=true;var requestedDate=selected;el('refresh').disabled=true;el('refresh').textContent='확인 중…';
 Promise.all([readDate(requestedDate),readAll('recurring')]).then(function(parts){
  // Replace only after both collections, including all pages, have arrived.
  var times=data&&data.checkedDates||{};times[requestedDate]=Date.now();
  var existing=data?data.absence.filter(function(r){return r.date!==requestedDate;}):[];
  data={version:1,savedAt:Date.now(),checkedDates:times,absence:existing.concat(parts[0]),recurring:parts[1]};live=true;failures=0;
  try{localStorage.setItem(cacheKey,JSON.stringify(data));storageOK=true;}catch(e){storageOK=false;}
 }).catch(function(){live=false;failures++;}).then(function(){
  busy=false;el('refresh').disabled=false;el('refresh').textContent='지금 갱신';render();if(requestedDate!==selected)sync();else schedule();
 });
}
function effective(number,date) {
 var by={},weekday=new Date(date+'T12:00:00Z').getUTCDay();
 if(!data)return by;
 data.recurring.slice().sort(function(a,b){return String(a.updatedAt||'').localeCompare(String(b.updatedAt||''))||a.id.localeCompare(b.id);}).forEach(function(r){
  if(Number(r.number)===number && (r.weekdays||[]).map(Number).indexOf(weekday)>=0)(r.cips||[]).forEach(function(c){by[Number(c)]=r.reason||'불참';});
 });
 data.absence.forEach(function(r){if(Number(r.number)===number&&r.date===date)(r.cips||[]).forEach(function(c){by[Number(c)]=r.reason||'불참';});});
 return by;
}
function dateTime(date) { return !data?0:data.checkedDates?data.checkedDates[date]||0:date<=korea(data.savedAt).date?data.savedAt:0; }
function hasDate(date) { return dateTime(date)>0; }
function render() {
 var t=korea(), current=cipAt(t), known=hasDate(selected), fresh=live&&data&&Date.now()-dateTime(selected)<120000;
 el('clock').textContent=t.date+' ('+'일월화수목금토'.charAt(t.weekday)+') '+pad(t.hour)+':'+pad(t.minute)+':'+pad(t.second);
 el('cip').textContent=selected!==t.date?selected+' 불참 예정 조회':current?'CIP '+current+'차 진행 중':'현재 CIP 진행 시간이 아닙니다 · 1차 16:50 / 2차 18:40 / 3차 20:10';
 el('connection').className=fresh&&known?'fresh':'';
 el('connection').textContent=!data?'아직 자료를 받지 못했습니다 · 연결을 확인하고 ‘지금 갱신’을 눌러주세요.':!known?'이 날짜의 자료는 아직 확인하지 못했습니다 · 저장 당시의 정기 일정만 참고용으로 표시합니다.':(fresh?'연결됨 · CIP 중 1분 / 그 외 5분마다 확인':'저장된 자료 표시 중 · 최신 신청과 다를 수 있습니다')+' · 마지막 확인 '+stamp(dateTime(selected));
 el('saveStatus').textContent=!storageOK?'이 기기에 자료를 보관할 수 없습니다. ‘오프라인 파일 저장’을 이용해주세요.':shellReady?(data?'화면과 자료 보관 준비 완료 · 다음부터 연결이 끊겨도 이 주소를 다시 열 수 있습니다.':'화면 보관 완료 · 자료는 아직 받지 못했습니다. 연결을 확인해주세요.'):'이 기기에 마지막 자료를 보관합니다. 연결이 복구되면 자동 갱신합니다.';
 el('download').disabled=!data;
 for(var n=1;n<=36;n++){
  var seat=el('seat-'+n),reasons=el('reason-'+n),by=effective(n,selected);
  seat.className='seat';reasons.textContent='';
  if(disabled.indexOf(n)>=0){seat.className+=' disabled';reasons.textContent='비활성';continue;}
  if(!known)seat.className+=' unknown';
  else if(selected===t.date?current&&by[current]:Object.keys(by).length)seat.className+=' absent';
  if(!data){reasons.textContent='자료 확인 전';continue;}
  var groups={};Object.keys(by).sort().forEach(function(c){var key=by[c];if(!Object.prototype.hasOwnProperty.call(groups,key))Object.defineProperty(groups,key,{value:[],enumerable:true});groups[key].push(c+'차');});
  Object.keys(groups).forEach(function(reason){var line=document.createElement('div');line.textContent=groups[reason].join('·')+' '+reason;reasons.appendChild(line);});
  if(!known&&!Object.keys(by).length)reasons.textContent='자료 확인 전';
 }
}
function tick() {
 var today=korea().date, cip=cipAt(korea());
 if(today!==lastToday){lastToday=today;if(followToday){selected=today;el('date').value=today;}sync();}
 if(cip!==lastCip){lastCip=cip;sync();}
 render();
}
function download() {
 if(!data)return;
 // Use a clone; never alter the live page or include unsanitized HTML from records.
 var root=document.documentElement.cloneNode(true);
 root.querySelector('#saved-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
 root.querySelector('#download').removeAttribute('disabled');
 var blob=new Blob(['<!doctype html>\n'+root.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='야자-스마트칠판-'+korea(data.savedAt).date+'.html';a.click();setTimeout(function(){URL.revokeObjectURL(url);},60000);
}
el('grid').textContent='';
for(var n=1;n<=36;n++){
 var seat=document.createElement('div');seat.id='seat-'+n;seat.className='seat unknown';
 var num=document.createElement('div');num.className='number';num.textContent=n+'번';seat.appendChild(num);
 var name=document.createElement('div');name.className='name';name.textContent=students[n];seat.appendChild(name);
 var reason=document.createElement('div');reason.className='reason';reason.id='reason-'+n;seat.appendChild(reason);el('grid').appendChild(seat);
}
el('date').value=selected;
el('date').onchange=function(){selected=this.value||korea().date;followToday=selected===korea().date;render();sync();};
el('today').onclick=function(){selected=korea().date;el('date').value=selected;followToday=true;render();sync();};
el('refresh').onclick=sync;el('download').onclick=download;
el('fullscreen').onclick=function(){var target=document.documentElement,fn=target.requestFullscreen||target.webkitRequestFullscreen;if(fn){try{var p=fn.call(target);if(p&&p.catch)p.catch(function(){});}catch(e){}}};
window.addEventListener('online',sync);
window.addEventListener('offline',function(){live=false;render();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync();});
loadSaved();render();setInterval(tick,1000);sync();
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
 if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./board-sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){shellReady=true;render();}).catch(function(){el('manual').style.display='block';});
 }else el('manual').style.display='block';
}
}());
</script>
</html>
