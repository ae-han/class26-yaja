<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>2학년 6반 야자 관리</title>


<style>

* {
    box-sizing: border-box;
}


html {
    -webkit-text-size-adjust: 100%;
}


body {

    margin: 0;

    padding:
        clamp(6px, 1.5vw, 24px);

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f3f5f7;

    color: #222;

}


/* ========================================
   제목
======================================== */

h1 {

    margin:
        5px 0 5px;

    text-align: center;

    font-size:
        clamp(28px, 3.2vw, 44px);

}


#clock {

    text-align: center;

    font-weight: 800;

    font-size:
        clamp(17px, 2vw, 27px);

    margin-bottom: 8px;

}


.current-cip {

    max-width: 760px;

    margin:
        0 auto
        clamp(15px, 2vw, 23px);

    padding:
        clamp(10px, 1.3vw, 14px);

    background: #252525;

    color: white;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

    font-size:
        clamp(13px, 1.4vw, 18px);

}


/* ========================================
   전체 영역
======================================== */

.container {

    width: 100%;

    max-width: 1500px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(285px, 345px);

    gap:
        clamp(12px, 2vw, 30px);

    align-items: start;

}


/* ========================================
   좌석 영역
======================================== */

.seat-area {

    min-width: 0;

    background: white;

    padding:
        clamp(8px, 1.6vw, 22px);

    border-radius: 15px;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,0.08);

}


.teacher {

    background: #333;

    color: white;

    border-radius: 8px;

    padding:
        clamp(9px, 1.2vw, 14px);

    text-align: center;

    font-size:
        clamp(13px, 1.5vw, 18px);

    font-weight: bold;

    margin-bottom:
        clamp(10px, 1.5vw, 20px);

}


/* ========================================
   6 × 6 좌석
======================================== */

.seat-grid {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(6, minmax(0, 1fr));

    gap:
        clamp(3px, 0.7vw, 10px);

}


.seat {

    min-width: 0;

    width: 100%;

    aspect-ratio: 1 / 0.95;

    min-height: 70px;

    padding:
        clamp(2px, 0.5vw, 6px);

    background: #e8f1ff;

    border:
        clamp(1px, 0.15vw, 2px)
        solid #7da7e8;

    border-radius:
        clamp(5px, 0.7vw, 10px);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;

    transition:
        background 0.2s,
        border-color 0.2s;

}


.number {

    font-size:
        clamp(21px, 3vw, 40px);

    font-weight: 900;

    line-height: 1;

}


.name {

    margin-top:
        clamp(3px, 0.5vw, 7px);

    font-size:
        clamp(8px, 1.15vw, 16px);

    font-weight: bold;

    white-space: nowrap;

}


.status {

    margin-top:
        clamp(2px, 0.4vw, 6px);

    max-width: 100%;

    font-size:
        clamp(7px, 0.8vw, 12px);

    line-height: 1.25;

    font-weight: bold;

    overflow-wrap: anywhere;

}


/* 현재 CIP 불참 */

.seat.absent {

    background: #ffd9d9;

    border-color: #e53935;

    color: #9d0000;

}


/* 비활성화 */

.seat.disabled {

    background: #c9c9c9;

    border-color: #999;

    color: #777;

}


/* ========================================
   신청 패널
======================================== */

.control-panel {

    min-width: 0;

    width: 100%;

    background: white;

    padding:
        clamp(17px, 2vw, 23px);

    border-radius: 15px;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,0.08);

    position: sticky;

    top: 10px;

}


.control-panel h2 {

    margin:
        0 0 18px;

    font-size:
        clamp(20px, 2vw, 25px);

}


label {

    display: block;

    font-weight: bold;

    font-size: 14px;

    margin-top: 3px;

}


input,
textarea,
button {

    width: 100%;

    min-height: 44px;

    padding: 11px;

    margin-top: 7px;

    margin-bottom: 16px;

    border-radius: 8px;

    border: 1px solid #ccc;

    font-family: inherit;

    font-size: 16px;

}


textarea {

    min-height: 72px;

    resize: vertical;

}


/* ========================================
   CIP 선택
======================================== */

.cip-buttons {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0,1fr));

    gap: 7px;

    margin-top: 8px;

    margin-bottom: 18px;

}


.cip-btn {

    min-width: 0;

    margin: 0;

    padding: 9px 2px;

    background: #f1f3f5;

    color: #333;

    border: 2px solid #ccc;

    font-weight: bold;

    cursor: pointer;

}


.cip-btn.selected {

    background: #1976d2;

    border-color: #1976d2;

    color: white;

}


.cip-time {

    display: block;

    font-size: 9px;

    font-weight: normal;

    margin-top: 3px;

}


/* ========================================
   신청 버튼
======================================== */

.submit-btn {

    background: #1976d2;

    color: white;

    border: 0;

    font-weight: bold;

    cursor: pointer;

}


.cancel-btn {

    background: #555;

    color: white;

    border: 0;

    font-weight: bold;

    cursor: pointer;

}


/* ========================================
   메시지
======================================== */

.message {

    min-height: 25px;

    margin-bottom: 8px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

}


/* ========================================
   Firebase 연결 상태
======================================== */

.connection-status {

    margin-bottom: 15px;

    padding: 8px;

    border-radius: 7px;

    text-align: center;

    font-size: 12px;

    font-weight: bold;

    background: #eee;

}


.connection-status.online {

    background: #ddf5e3;

    color: #176b2d;

}


.connection-status.error {

    background: #ffe0e0;

    color: #9b0000;

}


/* ========================================
   불참자 목록
======================================== */

.absence-list {

    margin-top: 17px;

    border-top: 1px solid #ddd;

    padding-top: 13px;

}


.absence-list h3 {

    margin:
        0 0 10px;

}


.absence-item {

    margin-bottom: 7px;

    padding: 9px;

    border-radius: 7px;

    background: #f5f5f5;

    font-size: 12px;

    line-height: 1.45;

}


/* ========================================
   태블릿
======================================== */

@media(max-width: 900px) {

    .container {

        grid-template-columns:
            1fr;

    }


    .control-panel {

        position: static;

    }

}


/* ========================================
   스마트폰
======================================== */

@media(max-width: 600px) {

    body {

        padding: 5px;

    }


    .seat-area {

        padding: 6px;

    }


    .teacher {

        margin-bottom: 6px;

    }


    .seat-grid {

        gap: 3px;

    }


    .seat {

        min-height: 55px;

        border-width: 1px;

        border-radius: 5px;

        padding: 1px;

    }


    .number {

        font-size:
            clamp(17px, 6vw, 25px);

    }


    .name {

        font-size:
            clamp(7px, 2.4vw, 10px);

    }


    .status {

        font-size:
            clamp(6px, 2vw, 9px);

    }


    .control-panel {

        padding: 16px;

    }

}


/* ========================================
   아주 작은 화면
======================================== */

@media(max-width: 380px) {

    .seat-grid {

        gap: 2px;

    }


    .name {

        font-size: 7px;

    }

}

</style>

</head>


<body>


<h1>
    2학년 6반
</h1>


<div id="clock">
    시간 확인 중...
</div>


<div
    id="currentCip"
    class="current-cip">

    현재 CIP 확인 중...

</div>



<div class="container">


<!-- ======================================
     좌석표
======================================= -->

<section class="seat-area">

    <div class="teacher">
        칠판 / 교탁
    </div>


    <div
        id="seatGrid"
        class="seat-grid">
    </div>

</section>



<!-- ======================================
     신청창
======================================= -->

<aside class="control-panel">


    <h2>
        🌙 야자 불참 신청
    </h2>


    <div
        id="connectionStatus"
        class="connection-status">

        Firebase 연결 중...

    </div>



    <label for="studentInput">
        번호 또는 이름
    </label>


    <input
        id="studentInput"
        type="text"
        list="studentList"
        autocomplete="off"
        placeholder="예: 23 또는 윤하유"
    >


    <datalist id="studentList">
    </datalist>



    <label>
        불참할 CIP 선택
    </label>


    <div class="cip-buttons">


        <button
            type="button"
            class="cip-btn"
            data-cip="1">

            1차

            <span class="cip-time">
                16:50~17:40
            </span>

        </button>



        <button
            type="button"
            class="cip-btn"
            data-cip="2">

            2차

            <span class="cip-time">
                18:40~20:00
            </span>

        </button>



        <button
            type="button"
            class="cip-btn"
            data-cip="3">

            3차

            <span class="cip-time">
                20:10~21:00
            </span>

        </button>


    </div>



    <label for="reason">
        야자 불참 사유
    </label>


    <textarea
        id="reason"
        maxlength="100"
        placeholder="예: 학원, 병원, 가족 행사"
    ></textarea>



    <label for="password">
        비밀번호
    </label>


    <input
        id="password"
        type="password"
        maxlength="4"
        inputmode="numeric"
        placeholder="비밀번호 4자리"
    >



    <button
        id="submitButton"
        type="button"
        class="submit-btn">

        야자 불참 신청

    </button>



    <button
        id="cancelButton"
        type="button"
        class="cancel-btn">

        전체 불참 신청 취소

    </button>



    <div
        id="message"
        class="message">
    </div>



    <div class="absence-list">

        <h3>
            오늘 전체 신청 현황
        </h3>


        <div id="absenceList">

            불러오는 중...

        </div>

    </div>


</aside>


</div>



<!-- ========================================
     Firebase + JavaScript
========================================= -->

<script type="module">


/* =========================================
   Firebase 불러오기
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

    getFirestore,
    collection,
    doc,
    setDoc,
    deleteDoc,
    onSnapshot,
    query,
    where,
    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



/* =========================================
   Firebase 설정
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCd8fUYXmJ34L1yG3x3aNsEGZgaxFLLx7s",

    authDomain:
        "yaja2-6.firebaseapp.com",

    projectId:
        "yaja2-6",

    storageBucket:
        "yaja2-6.firebasestorage.app",

    messagingSenderId:
        "732002055042",

    appId:
        "1:732002055042:web:d95f280cea84dd7036d59b",

    measurementId:
        "G-TKP2QV869R"

};



const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);



/* =========================================
   학생
========================================= */

const students = {

    1:"강주형",
    2:"고진용",
    3:"권율",

    4:"X",

    5:"김경태",
    6:"김용준",
    7:"김제겸",
    8:"김지효",
    9:"김하윤",
    10:"김현성",

    11:"목지안",
    12:"백시우",
    13:"서재훈",
    14:"서지후",
    15:"성무빈",
    16:"송재호",
    17:"신예준",
    18:"신준모",
    19:"양서희",
    20:"오태진",

    21:"윤수찬",
    22:"윤정연",
    23:"윤하유",
    24:"이지성",
    25:"이지혁",
    26:"이지후",
    27:"전윤우",
    28:"정준기",
    29:"정하율",
    30:"조동현",

    31:"차이한",
    32:"최담호",
    33:"최유진",
    34:"최태웅",

    35:"X",
    36:"X"

};



const disabledStudents = [

    4,
    35,
    36

];



/* =========================================
   비밀번호

   현재 모두 0000
========================================= */

const passwords = {};


for(
    let i = 1;
    i <= 36;
    i++
){

    passwords[i] =
        "0000";

}



/* =========================================
   CIP 시간
========================================= */

const cipTimes = {

    1: {

        start:
            16 * 60 + 50,

        end:
            17 * 60 + 40

    },


    2: {

        start:
            18 * 60 + 40,

        end:
            20 * 60

    },


    3: {

        start:
            20 * 60 + 10,

        end:
            21 * 60

    }

};



let selectedCips = [];

let absenceData = {};

let currentCip = null;

let currentDateKey = "";



/* =========================================
   한국시간
========================================= */

function getKoreaTimeParts(){


    const formatter =
        new Intl.DateTimeFormat(

            "ko-KR",

            {

                timeZone:
                    "Asia/Seoul",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }

        );


    const parts =
        formatter
            .formatToParts(
                new Date()
            );


    const result = {};


    for(
        const part
        of parts
    ){

        if(
            part.type !==
            "literal"
        ){

            result[
                part.type
            ] =
                part.value;

        }

    }


    return result;

}



/* =========================================
   날짜 키

   예: 2026-08-27
========================================= */

function getKoreaDateKey(){


    const t =
        getKoreaTimeParts();


    return (

        t.year +
        "-" +
        t.month +
        "-" +
        t.day

    );

}



/* =========================================
   현재 CIP 계산
========================================= */

function calculateCurrentCip(){


    const t =
        getKoreaTimeParts();


    const total =

        Number(t.hour)
        * 60
        +
        Number(t.minute);



    if(

        total >=
            cipTimes[1].start

        &&

        total <
            cipTimes[1].end

    ){

        return 1;

    }



    if(

        total >=
            cipTimes[2].start

        &&

        total <
            cipTimes[2].end

    ){

        return 2;

    }



    if(

        total >=
            cipTimes[3].start

        &&

        total <
            cipTimes[3].end

    ){

        return 3;

    }



    return null;

}



/* =========================================
   실시간 시계
========================================= */

function updateClock(){


    const t =
        getKoreaTimeParts();


    document
        .getElementById(
            "clock"
        )
        .textContent =

        `${t.year}.${t.month}.${t.day} ${t.hour}:${t.minute}:${t.second}`;



    const newCip =
        calculateCurrentCip();


    if(
        newCip !==
        currentCip
    ){

        currentCip =
            newCip;

        updateScreen();

    }


    updateCurrentCipText();



    /*
       날짜가 바뀌었는지 확인
    */

    const newDate =
        getKoreaDateKey();


    if(
        newDate !==
        currentDateKey
    ){

        location.reload();

    }

}



/* =========================================
   현재 CIP 안내
========================================= */

function updateCurrentCipText(){


    const box =
        document.getElementById(
            "currentCip"
        );


    const t =
        getKoreaTimeParts();


    const total =

        Number(t.hour)
        * 60
        +
        Number(t.minute);



    if(
        currentCip === 1
    ){

        box.innerHTML =

            "현재 <strong>CIP 1차</strong> 진행 중 · 16:50 ~ 17:40";

        return;

    }



    if(
        currentCip === 2
    ){

        box.innerHTML =

            "현재 <strong>CIP 2차</strong> 진행 중 · 18:40 ~ 20:00";

        return;

    }



    if(
        currentCip === 3
    ){

        box.innerHTML =

            "현재 <strong>CIP 3차</strong> 진행 중 · 20:10 ~ 21:00";

        return;

    }



    if(
        total <
        cipTimes[1].start
    ){

        box.innerHTML =

            "현재 CIP 시간이 아닙니다 · 다음: <strong>CIP 1차 16:50</strong>";

        return;

    }



    if(

        total >=
            cipTimes[1].end

        &&

        total <
            cipTimes[2].start

    ){

        box.innerHTML =

            "쉬는 시간 · 다음: <strong>CIP 2차 18:40</strong>";

        return;

    }



    if(

        total >=
            cipTimes[2].end

        &&

        total <
            cipTimes[3].start

    ){

        box.innerHTML =

            "쉬는 시간 · 다음: <strong>CIP 3차 20:10</strong>";

        return;

    }



    box.innerHTML =

        "오늘의 CIP 시간이 종료되었습니다.";

}



/* =========================================
   좌석 생성
========================================= */

function createSeats(){


    const grid =
        document.getElementById(
            "seatGrid"
        );


    grid.innerHTML =
        "";


    for(
        let i = 1;
        i <= 36;
        i++
    ){


        const seat =
            document.createElement(
                "div"
            );


        seat.id =
            "seat-" + i;


        seat.className =
            "seat";


        if(
            disabledStudents
                .includes(i)
        ){

            seat
                .classList
                .add(
                    "disabled"
                );

        }


        seat.innerHTML = `

            <div class="number">
                ${i}
            </div>

            <div class="name">
                ${students[i]}
            </div>

            <div
                id="status-${i}"
                class="status">
            </div>

        `;


        grid
            .appendChild(
                seat
            );

    }

}



/* =========================================
   이름 자동완성
========================================= */

function createStudentList(){


    const list =
        document.getElementById(
            "studentList"
        );


    list.innerHTML =
        "";


    for(
        let i = 1;
        i <= 36;
        i++
    ){


        if(
            disabledStudents
                .includes(i)
        ){

            continue;

        }



        const numberOption =
            document.createElement(
                "option"
            );


        numberOption.value =
            String(i);


        numberOption.label =
            students[i];


        list.appendChild(
            numberOption
        );



        const nameOption =
            document.createElement(
                "option"
            );


        nameOption.value =
            students[i];


        nameOption.label =
            i + "번";


        list.appendChild(
            nameOption
        );

    }

}



/* =========================================
   CIP 버튼
========================================= */

function toggleCip(button){


    const cip =
        Number(
            button.dataset.cip
        );


    if(
        selectedCips
            .includes(cip)
    ){


        selectedCips =
            selectedCips
                .filter(
                    item =>
                        item !== cip
                );


        button
            .classList
            .remove(
                "selected"
            );


    }else{


        selectedCips
            .push(cip);


        selectedCips
            .sort(
                (a,b) =>
                    a-b
            );


        button
            .classList
            .add(
                "selected"
            );

    }

}



/* =========================================
   번호 또는 이름 검색
========================================= */

function findStudent(){


    let input =
        document
            .getElementById(
                "studentInput"
            )
            .value
            .trim();


    input =
        input
            .replace(
                "번",
                ""
            )
            .trim();



    if(
        /^\d+$/
            .test(input)
    ){


        const number =
            Number(input);


        if(

            number >= 1

            &&

            number <= 36

        ){

            return number;

        }

    }



    for(
        let i = 1;
        i <= 36;
        i++
    ){


        if(
            students[i] ===
            input
        ){

            return i;

        }

    }



    return null;

}



/* =========================================
   불참 신청
========================================= */

async function applyAbsence(){


    const student =
        findStudent();


    const reason =
        document
            .getElementById(
                "reason"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;



    if(
        student === null
    ){

        showError(
            "올바른 번호 또는 이름을 입력해주세요."
        );

        return;

    }



    if(
        disabledStudents
            .includes(
                student
            )
    ){

        showError(
            student +
            "번은 비활성 번호입니다."
        );

        return;

    }



    if(
        selectedCips.length === 0
    ){

        showError(
            "불참할 CIP를 선택해주세요."
        );

        return;

    }



    if(
        reason === ""
    ){

        showError(
            "불참 사유를 입력해주세요."
        );

        return;

    }



    if(
        password !==
        passwords[student]
    ){

        showError(
            "비밀번호가 틀렸습니다."
        );

        return;

    }



    const date =
        getKoreaDateKey();


    /*
       날짜 + 학생번호를
       문서 ID로 사용

       예:
       2026-08-27_23
    */

    const documentId =

        date +
        "_" +
        student;



    try{


        await setDoc(

            doc(
                db,
                "absence",
                documentId
            ),

            {

                date:
                    date,

                number:
                    student,

                name:
                    students[student],

                cips:
                    [...selectedCips],

                reason:
                    reason,

                updatedAt:
                    serverTimestamp()

            }

        );


        showSuccess(

            student +
            "번 " +
            students[student] +
            " 신청 완료"

        );


        clearInputs();


    }catch(error){


        console.error(
            error
        );


        showError(
            "Firebase 저장에 실패했습니다."
        );

    }

}



/* =========================================
   불참 신청 취소
========================================= */

async function cancelAbsence(){


    const student =
        findStudent();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;



    if(
        student === null
    ){

        showError(
            "번호 또는 이름을 입력해주세요."
        );

        return;

    }



    if(
        disabledStudents
            .includes(
                student
            )
    ){

        showError(
            "비활성 번호입니다."
        );

        return;

    }



    if(
        password !==
        passwords[student]
    ){

        showError(
            "비밀번호가 틀렸습니다."
        );

        return;

    }



    if(
        !absenceData[student]
    ){

        showError(
            "오늘 등록된 불참 신청이 없습니다."
        );

        return;

    }



    const date =
        getKoreaDateKey();


    const documentId =

        date +
        "_" +
        student;



    try{


        await deleteDoc(

            doc(
                db,
                "absence",
                documentId
            )

        );


        showSuccess(

            student +
            "번 " +
            students[student] +
            " 신청 취소 완료"

        );


        clearInputs();


    }catch(error){


        console.error(
            error
        );


        showError(
            "신청 취소에 실패했습니다."
        );

    }

}



/* =========================================
   Firebase 실시간 동기화
========================================= */

function startRealtimeSync(){


    currentDateKey =
        getKoreaDateKey();



    /*
       오늘 날짜 데이터만 가져옴
    */

    const todayQuery =
        query(

            collection(
                db,
                "absence"
            ),

            where(
                "date",
                "==",
                currentDateKey
            )

        );



    onSnapshot(

        todayQuery,


        snapshot => {


            absenceData =
                {};


            snapshot
                .forEach(

                    document => {


                        const data =
                            document.data();


                        absenceData[
                            data.number
                        ] = {

                            cips:
                                data.cips,

                            reason:
                                data.reason

                        };

                    }

                );


            updateScreen();


            setConnectionStatus(

                "실시간 공유 연결됨",

                "online"

            );

        },


        error => {


            console.error(
                error
            );


            setConnectionStatus(

                "Firebase 연결 오류",

                "error"

            );


            showError(

                "Firestore 규칙 또는 연결을 확인해주세요."

            );

        }

    );

}



/* =========================================
   좌석 업데이트
========================================= */

function updateScreen(){


    for(
        let i = 1;
        i <= 36;
        i++
    ){


        const seat =
            document.getElementById(
                "seat-" + i
            );


        const status =
            document.getElementById(
                "status-" + i
            );



        if(
            disabledStudents
                .includes(i)
        ){


            status.textContent =
                "비활성";


            continue;

        }



        seat
            .classList
            .remove(
                "absent"
            );


        status.innerHTML =
            "";



        /*
           현재 CIP가 아니면
           빨간 표시하지 않음
        */

        if(
            currentCip === null
        ){

            continue;

        }



        const data =
            absenceData[i];


        if(
            !data
        ){

            continue;

        }



        if(
            data.cips
                .includes(
                    currentCip
                )
        ){


            seat
                .classList
                .add(
                    "absent"
                );


            status.innerHTML =

                "CIP " +
                currentCip +
                "차 불참"

                +

                "<br>"

                +

                escapeHtml(
                    data.reason
                );

        }

    }



    updateAbsenceList();

}



/* =========================================
   전체 신청 목록
========================================= */

function updateAbsenceList(){


    const list =
        document.getElementById(
            "absenceList"
        );


    const numbers =
        Object.keys(
            absenceData
        );


    if(
        numbers.length === 0
    ){


        list.textContent =
            "오늘 신청자가 없습니다.";


        return;

    }



    numbers.sort(

        (a,b) =>

            Number(a)
            -
            Number(b)

    );


    list.innerHTML =
        "";



    for(
        const number
        of numbers
    ){


        const data =
            absenceData[number];


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "absence-item";


        const cipText =
            data.cips

                .map(
                    cip =>
                        "CIP " +
                        cip +
                        "차"
                )

                .join(
                    " · "
                );


        item.innerHTML =

            "<strong>"
            +
            number
            +
            "번 "
            +
            students[number]
            +
            "</strong>"

            +

            "<br>"

            +

            cipText

            +

            "<br>"

            +

            escapeHtml(
                data.reason
            );


        list.appendChild(
            item
        );

    }

}



/* =========================================
   입력창 초기화
========================================= */

function clearInputs(){


    document
        .getElementById(
            "studentInput"
        )
        .value =
            "";


    document
        .getElementById(
            "reason"
        )
        .value =
            "";


    document
        .getElementById(
            "password"
        )
        .value =
            "";


    selectedCips =
        [];


    document
        .querySelectorAll(
            ".cip-btn"
        )
        .forEach(

            button => {

                button
                    .classList
                    .remove(
                        "selected"
                    );

            }

        );

}



/* =========================================
   메시지
========================================= */

function showError(text){


    const message =
        document.getElementById(
            "message"
        );


    message.style.color =
        "#b00020";


    message.textContent =
        text;

}



function showSuccess(text){


    const message =
        document.getElementById(
            "message"
        );


    message.style.color =
        "green";


    message.textContent =
        text;

}



/* =========================================
   Firebase 상태
========================================= */

function setConnectionStatus(
    text,
    type
){


    const status =
        document.getElementById(
            "connectionStatus"
        );


    status.textContent =
        text;


    status.className =
        "connection-status";


    if(type){

        status.classList.add(
            type
        );

    }

}



/* =========================================
   HTML 안전 처리
========================================= */

function escapeHtml(text){


    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================
   버튼 이벤트
========================================= */

document
    .querySelectorAll(
        ".cip-btn"
    )
    .forEach(

        button => {

            button
                .addEventListener(

                    "click",

                    () =>
                        toggleCip(
                            button
                        )

                );

        }

    );



document
    .getElementById(
        "submitButton"
    )
    .addEventListener(

        "click",
        applyAbsence

    );



document
    .getElementById(
        "cancelButton"
    )
    .addEventListener(

        "click",
        cancelAbsence

    );



/* =========================================
   시작
========================================= */

createSeats();

createStudentList();


currentDateKey =
    getKoreaDateKey();


currentCip =
    calculateCurrentCip();


updateScreen();

updateClock();


startRealtimeSync();


setInterval(

    updateClock,

    1000

);


</script>
