<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>2학년 6반 야자 관리</title>

<style>
* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    padding: clamp(6px, 1.4vw, 22px);
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f3f5f7;
    color: #222;
}


/* 대표 화면 버튼 */

#displayModeButton {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 9999;

    width: auto;
    min-width: 105px;
    min-height: 44px;

    margin: 0;
    padding: 9px 14px;

    border: 0;
    border-radius: 9px;

    background: #222;
    color: white;

    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
}


/* 상단 */

.header {
    text-align: center;
    margin-bottom: 18px;
}

h1 {
    margin: 4px 0 5px;
    font-size: clamp(28px, 3vw, 44px);
}

#clock {
    margin-bottom: 8px;
    font-size: clamp(17px, 2vw, 27px);
    font-weight: 900;
}

.current-cip {
    max-width: 780px;
    margin: 0 auto;
    padding: 11px 15px;

    border-radius: 10px;

    background: #252525;
    color: white;

    font-size: clamp(13px, 1.4vw, 18px);
    font-weight: 900;
}


/* 전체 */

.container {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 370px);
    gap: clamp(12px, 2vw, 28px);

    align-items: start;
}


/* 좌석 */

.seat-area {
    min-width: 0;
    padding: clamp(8px, 1.5vw, 22px);

    border-radius: 15px;

    background: white;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
}

.teacher {
    margin-bottom: clamp(9px, 1.3vw, 18px);
    padding: 11px;

    border-radius: 8px;

    background: #333;
    color: white;

    text-align: center;
    font-weight: bold;
}

.seat-grid {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(6, minmax(0,1fr));

    gap: clamp(3px, 0.7vw, 10px);
}

.seat {
    min-width: 0;
    width: 100%;

    aspect-ratio: 1 / 0.92;
    min-height: 70px;

    padding: clamp(2px, 0.5vw, 6px);

    border: 2px solid #7da7e8;
    border-radius: 9px;

    background: #e8f1ff;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;
    overflow: hidden;

    transition: 0.2s;
}


/* 번호 - 기존보다 작게 */

.number {
    font-size: clamp(18px, 2.5vw, 34px);
    font-weight: 900;
    line-height: 1;
}


/* 이름 - 기존보다 크게 */

.name {
    margin-top: 5px;

    font-size: clamp(10px, 1.3vw, 18px);
    font-weight: bold;

    white-space: nowrap;
}


/* 사유 - 기존보다 크게 */

.status {
    width: 100%;
    margin-top: 5px;

    font-size: clamp(9px, 1vw, 14px);
    line-height: 1.25;

    font-weight: 900;
    overflow-wrap: anywhere;
}


/* 날짜별 일반 불참 */

.seat.absent {
    background: #ffd9d9;
    border-color: #e53935;
    color: #950000;
}


/* 정기 불참 */

.seat.recurring {
    background: #ffd39d;
    border-color: #e67e22;
    color: #814100;
}


/* 날짜별 + 정기 */

.seat.both {
    background: #ffc788;
    border-color: #d35400;
    color: #702d00;
}


/* 창의반 */

.seat.creative {
    background: #b9dcff;
    border-color: #1976d2;
    color: #064b91;
}


/* 비활성 */

.seat.disabled {
    background: #c9c9c9;
    border-color: #999;
    color: #777;
}


/* 정기 사유 */

.recurring-text {
    color: #e26e00;
    font-weight: 900;
}


/* 창의반 */

.creative-text {
    color: #1565c0;
    font-weight: 900;
}


/* 오른쪽 관리 패널 */

.control-panel {
    width: 100%;
    min-width: 0;

    padding: clamp(16px, 2vw, 23px);

    border-radius: 15px;

    background: white;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);

    position: sticky;
    top: 10px;
}

.control-panel h2 {
    margin: 0 0 14px;
    font-size: 23px;
}

.section-title {
    margin: 24px 0 12px;
    padding-top: 17px;

    border-top: 2px solid #eee;

    font-size: 18px;
    font-weight: 900;
}

label {
    display: block;
    margin-top: 4px;

    font-size: 14px;
    font-weight: bold;
}

input,
button {
    width: 100%;
    min-height: 44px;

    padding: 11px;

    margin-top: 7px;
    margin-bottom: 15px;

    border-radius: 8px;
    border: 1px solid #ccc;

    font-family: inherit;
    font-size: 16px;
}


/* 날짜 */

.date-box {
    padding: 11px;
    margin-bottom: 17px;

    border-radius: 10px;
    background: #f5f7fa;
}

.date-box input {
    margin-bottom: 4px;
}

.date-info {
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    color: #555;
}


/* CIP */

.cip-buttons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));

    gap: 7px;

    margin-top: 8px;
    margin-bottom: 18px;
}

.cip-btn {
    min-width: 0;

    margin: 0;
    padding: 9px 2px;

    border: 2px solid #ccc;

    background: #f1f3f5;
    color: #333;

    font-weight: bold;
    cursor: pointer;
}

.cip-btn.selected {
    border-color: #1976d2;
    background: #1976d2;
    color: white;
}

.cip-time {
    display: block;
    margin-top: 3px;

    font-size: 9px;
    font-weight: normal;
}


/* 요일 */

.weekday-buttons {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));

    gap: 7px;

    margin-top: 8px;
    margin-bottom: 18px;
}

.weekday-btn {
    margin: 0;

    border: 2px solid #ccc;

    background: #f1f3f5;
    color: #333;

    font-weight: bold;
    cursor: pointer;
}

.weekday-btn.selected {
    border-color: #e67e22;
    background: #e67e22;
    color: white;
}


/* 사유 */

.reason-buttons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));

    gap: 7px;

    margin-top: 8px;
    margin-bottom: 15px;
}

.reason-btn {
    min-width: 0;

    margin: 0;
    padding: 9px 3px;

    border: 2px solid #ccc;

    background: #f3f3f3;
    color: #333;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;
}

.reason-btn.selected {
    border-color: #e67e22;
    background: #e67e22;
    color: white;
}

.reason-btn.selected[data-reason="창의반"] {
    border-color: #1976d2;
    background: #1976d2;
    color: white;
}

#singleOtherWrap,
#recurringOtherWrap {
    display: none;
}


/* 주요 버튼 */

.submit-btn {
    border: 0;
    background: #1976d2;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

.cancel-btn {
    border: 0;
    background: #555;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

.recurring-submit {
    border: 0;
    background: #e67e22;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

.recurring-cancel {
    border: 0;
    background: #795548;
    color: white;

    font-weight: bold;
    cursor: pointer;
}


/* Firebase 상태 */

.connection-status {
    margin-bottom: 15px;
    padding: 8px;

    border-radius: 7px;

    background: #eee;

    text-align: center;
    font-size: 12px;
    font-weight: bold;
}

.connection-status.online {
    background: #ddf5e3;
    color: #176b2d;
}

.connection-status.error {
    background: #ffe0e0;
    color: #9b0000;
}

.message {
    min-height: 24px;
    margin-bottom: 8px;

    text-align: center;
    font-size: 14px;
    font-weight: bold;
}


/* 불참 현황 */

.absence-list {
    margin-top: 18px;
    padding-top: 13px;

    border-top: 1px solid #ddd;
}

.absence-item {
    margin-bottom: 7px;
    padding: 9px;

    border-radius: 7px;

    background: #f5f5f5;

    font-size: 12px;
    line-height: 1.5;
}

.recurring-item {
    border-left: 5px solid #e67e22;
    background: #fff3e5;
}

.creative-item {
    border-left: 5px solid #1976d2;
    background: #e7f2ff;
}


/* ==================================================
   대표 화면
================================================== */

body.display-mode {
    padding: 6px;
    background: #111;
    overflow: hidden;
}

body.display-mode .control-panel {
    display: none;
}

body.display-mode .container {
    display: block;
    width: 100%;
    max-width: none;
}

body.display-mode .header {
    margin-bottom: 6px;
}

body.display-mode h1 {
    margin: 0;
    color: white;

    font-size: clamp(27px, 3.5vw, 48px);
}

body.display-mode #clock {
    margin: 1px 0 4px;
    color: white;

    font-size: clamp(20px, 2.7vw, 37px);
}

body.display-mode .current-cip {
    max-width: 1000px;
    padding: 6px 12px;

    font-size: clamp(17px, 2vw, 27px);
}

body.display-mode .seat-area {
    width: 100%;

    height: calc(100vh - 126px);
    height: calc(100dvh - 126px);

    padding: 4px;

    border-radius: 0;

    background: #111;
    box-shadow: none;

    display: flex;
    flex-direction: column;
}

body.display-mode .teacher {
    display: none;
}

body.display-mode .seat-grid {
    flex: 1;
    min-height: 0;

    display: grid;

    grid-template-columns: repeat(6, minmax(0,1fr));
    grid-template-rows: repeat(6, minmax(0,1fr));

    gap: clamp(3px, 0.55vw, 8px);
}

body.display-mode .seat {
    min-height: 0;
    height: 100%;

    aspect-ratio: auto;

    padding: 2px;

    border-width: 3px;
}


/* 대표화면 번호도 조금 작게 */

body.display-mode .number {
    font-size: clamp(21px, 2.8vw, 40px);
}


/* 대표화면 이름 크게 */

body.display-mode .name {
    font-size: clamp(12px, 1.7vw, 24px);
}


/* 대표화면 사유 크게 */

body.display-mode .status {
    font-size: clamp(10px, 1.2vw, 17px);
}

body.display-mode #displayModeButton {
    background: #d9534f;
}


/* 반응형 */

@media(max-width: 900px) {

    .container {
        grid-template-columns: 1fr;
    }

    .control-panel {
        position: static;
    }
}


@media(max-width: 600px) {

    body {
        padding: 5px;
    }

    #displayModeButton {
        top: 5px;
        left: 5px;

        min-width: 88px;
        min-height: 40px;

        padding: 6px 9px;

        font-size: 11px;
    }

    .seat-grid {
        gap: 3px;
    }

    .seat {
        min-height: 55px;
        padding: 1px;

        border-width: 1px;
    }

    .reason-buttons {
        grid-template-columns: repeat(2, minmax(0,1fr));
    }
}

</style>
</head>


<body>


<button id="displayModeButton" type="button">
    대표 화면
</button>


<header class="header">

    <h1>2학년 6반</h1>

    <div id="clock">
        시간 확인 중...
    </div>

    <div id="currentCip" class="current-cip">
        현재 상태 확인 중...
    </div>

</header>


<div class="container">


<section class="seat-area">

    <div class="teacher">
        칠판 / 교탁
    </div>

    <div id="seatGrid" class="seat-grid"></div>

</section>


<aside class="control-panel">


<h2>🌙 야자 불참 관리</h2>


<div id="connectionStatus" class="connection-status">
    Firebase 연결 중...
</div>


<div class="date-box">

    <label for="viewDate">
        조회 / 신청 날짜
    </label>

    <input id="viewDate" type="date">

    <div id="dateInfo" class="date-info"></div>

</div>


<label for="studentInput">
    번호 또는 이름
</label>

<input
    id="studentInput"
    type="text"
    list="studentList"
    autocomplete="off"
    placeholder="예: 25 또는 이지혁"
>

<datalist id="studentList"></datalist>


<!-- 날짜별 불참 -->

<div class="section-title">
    📅 날짜별 불참 신청
</div>


<label>불참할 CIP</label>


<div class="cip-buttons">

    <button
        type="button"
        class="cip-btn"
        data-type="single"
        data-cip="1">

        1차
        <span class="cip-time">16:50~17:40</span>

    </button>

    <button
        type="button"
        class="cip-btn"
        data-type="single"
        data-cip="2">

        2차
        <span class="cip-time">18:40~20:00</span>

    </button>

    <button
        type="button"
        class="cip-btn"
        data-type="single"

        3차
        <span class="cip-time">20:10~21:00</span>

    </button>

</div>


<label>불참 사유</label>


<div class="reason-buttons">

    <button type="button" class="reason-btn" data-scope="single" data-reason="학원">
        학원

    <button type="button" class="reason-btn" data-scope="single" data-reason="교내활동">

    </button>

    <button type="button" class="reason-btn" data-scope="single" data-reason="방과후">
        방과후
    </button>

    <button type="button" class="reason-btn" data-scope="single" data-reason="창의반">

    </button>

    <button type="button" class="reason-btn" data-scope="single" data-reason="기타">
        기타
    </button>

</div>


<div id="singleOtherWrap">

    <label for="singleOther">
        기타 사유
    </label>

    <input
        id="singleOther"
        type="text"
        maxlength="50"
        placeholder="직접 입력해주세요"
    >

</div>


<label for="singlePassword">
    비밀번호
</label>

<input
    id="singlePassword"
    type="password"
    maxlength="4"
    inputmode="numeric"
    placeholder="비밀번호 4자리"
>


<button id="singleSubmit" type="button" class="submit-btn">
    선택 날짜 불참 신청
</button>


<button id="singleCancel" type="button" class="cancel-btn">
    선택 날짜 신청 취소
</button>


<!-- 정기 불참 -->

<div class="section-title">
    🔁 매주 반복 불참
</div>


<label>반복 요일</label>


<div class="weekday-buttons">

    <button type="button" class="weekday-btn" data-day="1">
        월
    </button>

    <button type="button" class="weekday-btn" data-day="2">
        화
    </button>

    <button type="button" class="weekday-btn" data-day="3">
        수
    </button>

    <button type="button" class="weekday-btn" data-day="4">
        목
    </button>

</div>


<label>반복해서 빠질 CIP</label>


<div class="cip-buttons">

    <button
        type="button"
        class="cip-btn"
        data-type="recurring"
        data-cip="1">

        1차
        <span class="cip-time">16:50~17:40</span>

    </button>

    <button
        type="button"
        class="cip-btn"
        data-type="recurring"
        data-cip="2">

        2차
        <span class="cip-time">18:40~20:00</span>

    </button>

    <button
        type="button"
        class="cip-btn"
        data-type="recurring"
        data-cip="3">

        3차
        <span class="cip-time">20:10~21:00</span>

    </button>

</div>


<label>반복 불참 사유</label>


<div class="reason-buttons">

    <button type="button" class="reason-btn" data-scope="recurring" data-reason="학원">
        학원
    </button>

    <button type="button" class="reason-btn" data-scope="recurring" data-reason="교내활동">
        교내활동
    </button>

    <button type="button" class="reason-btn" data-scope="recurring" data-reason="공교">
        공교
    </button>

    <button type="button" class="reason-btn" data-scope="recurring" data-reason="방과후">
        방과후
    </button>

    <button type="button" class="reason-btn" data-scope="recurring" data-reason="창의반">
        창의반
    </button>

    <button type="button" class="reason-btn" data-scope="recurring" data-reason="기타">
        기타
    </button>

</div>


<div id="recurringOtherWrap">

    <label for="recurringOther">
        기타 사유
    </label>

    <input
        id="recurringOther"
        type="text"
        maxlength="50"
        placeholder="직접 입력해주세요"
    >

</div>


<label for="recurringPassword">
    반복 불참 비밀번호
</label>

<input
    id="recurringPassword"
    type="password"
    maxlength="4"
    inputmode="numeric"
    placeholder="비밀번호 4자리"
>


<button id="recurringSubmit" type="button" class="recurring-submit">
    매주 반복 불참 추가
</button>


<button id="recurringCancel" type="button" class="recurring-cancel">
    이 학생 정기 불참 전체 삭제
</button>


<div id="message" class="message"></div>


<div class="absence-list">

    <h3 id="listTitle">
        선택 날짜 불참 현황
    </h3>

    <div id="absenceList">
        불러오는 중...
    </div>

</div>


</aside>
</div>

/* ==================================================
   한국 시간
================================================== */

function getKoreaTimeParts() {

    const formatter = new Intl.DateTimeFormat(
        "ko-KR",
        {
            timeZone: "Asia/Seoul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        }
    );


    const parts = formatter.formatToParts(new Date());

    const result = {};


    parts.forEach(part => {

        if(part.type !== "literal") {
            result[part.type] = part.value;
        }

    });


    return result;
}


function getTodayKey() {

    const t = getKoreaTimeParts();

    return `${t.year}-${t.month}-${t.day}`;
}


function getWeekdayFromDate(dateString) {

    if(!dateString) {
        return 0;
    }


    const parts = dateString
        .split("-")
        .map(Number);


    const date = new Date(
        Date.UTC(
            parts[0],
            parts[1] - 1,
            parts[2]
        )
    );


    return date.getUTCDay();
}


/* ==================================================
   현재 CIP
================================================== */

function calculateCurrentCip() {

    const t = getKoreaTimeParts();

    const total =
        Number(t.hour) * 60 +
        Number(t.minute);


    if(
        total >= cipTimes[1].start &&
        total < cipTimes[1].end
    ) {
        return 1;
    }


    if(
        total >= cipTimes[2].start &&
        total < cipTimes[2].end
    ) {
        return 2;
    }


    if(
        total >= cipTimes[3].start &&
        total < cipTimes[3].end
    ) {
        return 3;
    }


    return null;
}


function getSituationText() {

    const t = getKoreaTimeParts();

    const total =
        Number(t.hour) * 60 +
        Number(t.minute);


    if(total < cipTimes[1].start) {
        return "CIP 전 · 1차 16:50 시작";
    }


    if(total < cipTimes[1].end) {
        return "CIP 1차 진행 중 · 16:50 ~ 17:40";
    }


    if(total < cipTimes[2].start) {
        return "쉬는 시간 · CIP 2차 18:40 시작";
    }


    if(total < cipTimes[2].end) {
        return "CIP 2차 진행 중 · 18:40 ~ 20:00";
    }


    if(total < cipTimes[3].start) {
        return "쉬는 시간 · CIP 3차 20:10 시작";
    }


    if(total < cipTimes[3].end) {
        return "CIP 3차 진행 중 · 20:10 ~ 21:00";
    }


    return "오늘의 CIP 종료";
}


/* ==================================================
   시계
================================================== */

function updateClock() {

    const t = getKoreaTimeParts();

    const today = getTodayKey();

    const weekday = getWeekdayFromDate(today);


    document.getElementById("clock").textContent =
        `${t.year}.${t.month}.${t.day} (${weekdayNames[weekday]}) ${t.hour}:${t.minute}:${t.second}`;


    const newCip = calculateCurrentCip();


    if(newCip !== currentCip) {

        currentCip = newCip;

        updateScreen();
    }


    updateCipInfo();
}


function updateCipInfo() {

    const box = document.getElementById("currentCip");


    if(displayMode) {

        box.textContent = getSituationText();
        return;
    }


    if(selectedDate !== getTodayKey()) {

        const weekday = getWeekdayFromDate(selectedDate);

        box.textContent =
            `${selectedDate} (${weekdayNames[weekday]}) 불참 현황 조회 중`;

        return;
    }


    box.textContent = getSituationText();
}

/* ==================================================
   학생 찾기
================================================== */

function findStudent() {

    let input = document
        .getElementById("studentInput")
        .value
        .trim();


    input = input
        .replace("번", "")
        .trim();


    if(/^\d+$/.test(input)) {

        const number = Number(input);


        if(number >= 1 && number <= 36) {

            return number;
        }
    }


    for(let i = 1; i <= 36; i++) {

        if(students[i] === input) {

            return i;
        }
    }


    return null;
}

function toggleArrayValue(array, value) {

    if(array.includes(value)) {

        return array.filter(
            item => item !== value
        );
    }


    return [
        ...array,
        value
    ].sort((a,b) => a-b);
}

                const wasSelected =
                    button.classList.contains("selected");


                document
                    .querySelectorAll(
                        `.reason-btn[data-scope="${scope}"]`
                    )
                    .forEach(otherButton => {

                        otherButton.classList.remove("selected");
                    });


                /* 같은 버튼을 다시 누르면 선택 해제 */

                if(wasSelected) {

                    if(scope === "single") {

                        selectedSingleReason = "";

                        hideOtherReason("single");

                    } else {

                        selectedRecurringReason = "";

                        hideOtherReason("recurring");
                    }

                    return;
                }


                button.classList.add("selected");


                if(scope === "single") {

                    selectedSingleReason = reason;

                    updateOtherReason(
                        "single",
                        reason
                    );

                } else {

                    selectedRecurringReason = reason;

                    updateOtherReason(
                        "recurring",
                        reason
                    );
                }
            }
        );

    });

function updateOtherReason(scope, reason) {

    const wrap = document.getElementById(
        scope === "single"

            : "recurringOtherWrap"
    );


    const input = document.getElementById(
        scope === "single"
            ? "singleOther"
            : "recurringOther"
    );


    if(reason === "기타") {

        wrap.style.display = "block";

        input.focus();

    } else {

        wrap.style.display = "none";

        input.value = "";
    }
}


function hideOtherReason(scope) {

    const wrap = document.getElementById(
        scope === "single"
            ? "singleOtherWrap"
            : "recurringOtherWrap"
    );


    const input = document.getElementById(
        scope === "single"
            ? "singleOther"
            : "recurringOther"
    );


    wrap.style.display = "none";

    input.value = "";
}

/* ==================================================
   정기 불참 추가

   학생 한 명에게 여러 개의 정기 일정 등록 가능
================================================== */

async function applyRecurringAbsence() {

    const student = findStudent();

    const password = document
        .getElementById("recurringPassword")
        .value;

    const reason = getRecurringReason();


    if(student === null) {

        showError("학생을 입력해주세요.");
        return;
    }


    if(disabledStudents.includes(student)) {

        showError("비활성 번호입니다.");
        return;
    }


    if(recurringDays.length === 0) {

        showError("반복 요일을 선택해주세요.");
        return;
    }


    if(recurringCips.length === 0) {

        showError("반복 CIP를 선택해주세요.");
        return;
    }


    if(reason === null) {

        showError("반복 불참 사유를 선택해주세요.");
        return;
    }


    if(password !== passwords[student]) {

        showError(
            "반복 불참 비밀번호가 틀렸습니다."
        );

        return;
    }


    const existingRules =
        recurringData[student] || [];


    const duplicate =
        existingRules.some(rule => {

            const sameDays =
                JSON.stringify(
                    [...rule.weekdays].sort((a,b) => a-b)
                )
                ===
                JSON.stringify(
                    [...recurringDays].sort((a,b) => a-b)
                );


            const sameCips =
                JSON.stringify(
                    [...rule.cips].sort((a,b) => a-b)
                )
                ===
                JSON.stringify(
                    [...recurringCips].sort((a,b) => a-b)
                );


            return (
                sameDays &&
                sameCips &&
                rule.reason === reason
            );
        });


    if(duplicate) {

        showError(
            "동일한 정기 일정이 이미 등록되어 있습니다."
        );

        return;
    }


    try {

        await addDoc(

            collection(
                db,
                "recurring"
            ),

            {
                number: student,

                name: students[student],

                weekdays: [...recurringDays],

                cips: [...recurringCips],

                reasonType: selectedRecurringReason,

                reason: reason,

                updatedAt: serverTimestamp()
            }
        );


        const daysText =
            recurringDays
                .map(day => weekdayNames[day])
                .join("·");


        showSuccess(
            `${student}번 ${students[student]} · ${daysText} ${reason} 추가 완료`
        );


        clearRecurringInput();

    } catch(error) {

        console.error(error);

        showError(
            "반복 불참 등록에 실패했습니다."
        );
    }
}

/* ==================================================
   날짜별 데이터 실시간 불러오기
================================================== */

function startDateSync() {

    if(unsubscribeSingle) {
        unsubscribeSingle();
    }


    const q = query(

        collection(
            db,
            "absence"
        ),

        where(
            "date",
            "==",
            selectedDate
        )
    );


    unsubscribeSingle =
        onSnapshot(

            q,

            snapshot => {

                singleAbsenceData = {};


                snapshot.forEach(
                    documentSnapshot => {

                        const data =
                            documentSnapshot.data();


                        singleAbsenceData[
                            data.number
                        ] = {

                            cips:
                                data.cips || [],

                            reason:
                                data.reason || "",

                            reasonType:
                                data.reasonType || ""
                        };
                    }
                );


                updateScreen();


                setConnectionStatus(
                    "실시간 공유 연결됨",
                    "online"
                );
            },

            error => {

                console.error(error);


                setConnectionStatus(
                    "Firebase 연결 오류",
                    "error"
                );
            }
        );
}


/* ==================================================
   정기 불참 실시간 불러오기
================================================== */

function startRecurringSync() {

    if(unsubscribeRecurring) {
        unsubscribeRecurring();
    }


    unsubscribeRecurring =
        onSnapshot(

            collection(
                db,
                "recurring"
            ),

            snapshot => {

                recurringData = {};


                snapshot.forEach(
                    documentSnapshot => {

                        const data =
                            documentSnapshot.data();


                        const number =
                            Number(data.number);


                        if(!recurringData[number]) {

                            recurringData[number] = [];
                        }


                        recurringData[number].push({

                            id:
                                documentSnapshot.id,

                            weekdays:
                                data.weekdays || [],

                            cips:
                                data.cips || [],

                            reason:
                                data.reason || "",

                            reasonType:
                                data.reasonType || ""
                        });
                    }
                );


                updateScreen();
            },

            error => {

                console.error(error);
            }
        );
}


/* ==================================================
   선택 날짜에 해당하는 정기 일정만 가져오기
================================================== */

function getRecurringForStudent(student) {

    const rules =
        recurringData[student] || [];


    const weekday =
        getWeekdayFromDate(selectedDate);


    return rules.filter(
        rule =>
            rule.weekdays.includes(
                weekday
            )
    );
}


/* ==================================================
   좌석 화면 업데이트
================================================== */

function updateScreen() {

    const today = getTodayKey();


    for(let i = 1; i <= 36; i++) {

        const seat =
            document.getElementById(
                "seat-" + i
            );


        const status =
            document.getElementById(
                "status-" + i
            );


        if(disabledStudents.includes(i)) {

            status.textContent = "비활성";

            continue;
        }


        seat.classList.remove(
            "absent",
            "recurring",
            "both",
            "creative"
        );


        const single =
            singleAbsenceData[i];


        /*
           그 날짜에 해당하는 정기 일정만 표시
           월요일이면 월요일 일정만,
           화요일이면 화요일 일정만 표시
        */

        const recurringToday =
            getRecurringForStudent(i);


        const lines = [];


        /*
           정기 불참은 요일 없이
           이름 아래에 "학원", "공교" 등만 표시
        */

        recurringToday.forEach(rule => {

            if(isCreativeReason(rule)) {

                lines.push(
                    `<span class="creative-text">창의반</span>`
                );

            } else {

                lines.push(
                    `<span class="recurring-text">${escapeHtml(rule.reason)}</span>`
                );
            }
        });


        /*
           날짜별 불참
        */

        if(single) {

            const cipText =
                single.cips
                    .map(c => c + "차")
                    .join("·");


            if(isCreativeReason(single)) {

                lines.push(
                    `<span class="creative-text">${cipText} 창의반</span>`
                );

            } else {

                lines.push(
                    `${cipText} ${escapeHtml(single.reason)}`
                );
            }
        }


        status.innerHTML =
            lines.join("<br>");


        let singleActive = false;

        let recurringActive = false;

        let creativeActive = false;


        /*
           오늘 날짜일 경우
           현재 진행 중인 CIP에 해당하는 학생만 색상 표시
        */

        if(selectedDate === today) {

            if(currentCip !== null) {

                singleActive =
                    !!single &&
                    single.cips.includes(
                        currentCip
                    );


                const activeRecurring =
                    recurringToday.filter(
                        rule =>
                            rule.cips.includes(
                                currentCip
                            )
                    );


                recurringActive =
                    activeRecurring.length > 0;


                creativeActive =

                    (
                        singleActive &&
                        isCreativeReason(single)
                    )

                    ||

                    activeRecurring.some(
                        rule =>
                            isCreativeReason(rule)
                    );
            }
        }

        /*
           다른 날짜 조회 시
           예정된 불참을 바로 색상으로 표시
        */

        else {

            singleActive =
                !!single;


            recurringActive =
                recurringToday.length > 0;


            creativeActive =

                (
                    singleActive &&
                    isCreativeReason(single)
                )

                ||

                recurringToday.some(
                    rule =>
                        isCreativeReason(rule)
                );
        }


        if(creativeActive) {

            seat.classList.add("creative");

        } else if(
            singleActive &&
            recurringActive
        ) {

            seat.classList.add("both");

        } else if(singleActive) {

            seat.classList.add("absent");

        } else if(recurringActive) {

            seat.classList.add("recurring");
        }
    }


    updateAbsenceList();
}


/* ==================================================
   오른쪽 불참 현황
================================================== */

function updateAbsenceList() {

    const list =
        document.getElementById(
            "absenceList"
        );


    const weekday =
        getWeekdayFromDate(
            selectedDate
        );


    document
        .getElementById("listTitle")
        .textContent =
        `${selectedDate} (${weekdayNames[weekday]}) 불참 현황`;


    const items = [];


    for(let i = 1; i <= 36; i++) {

        if(disabledStudents.includes(i)) {
            continue;
        }


        const single =
            singleAbsenceData[i];


        const recurring =
            getRecurringForStudent(i);


        if(
            !single &&
            recurring.length === 0
        ) {
            continue;
        }


        const creative =

            isCreativeReason(single)

            ||

            recurring.some(
                rule =>
                    isCreativeReason(rule)
            );


        let itemClass =
            "absence-item";


        if(creative) {

            itemClass += " creative-item";

        } else if(recurring.length > 0) {

            itemClass += " recurring-item";
        }


        let html = `

            <div class="${itemClass}">

                <strong>
                    ${i}번 ${students[i]}
                </strong>

        `;


        if(single) {

            const cips =
                single.cips
                    .map(
                        c => `CIP ${c}차`
                    )
                    .join(" · ");


            html += `

                <br>
                ${cips}

                <br>
                ${escapeHtml(single.reason)}

            `;
        }


        recurring.forEach(rule => {

            const cips =
                rule.cips
                    .map(
                        c => `CIP ${c}차`
                    )
                    .join(" · ");


            if(isCreativeReason(rule)) {

                html += `

                    <br>

                    <span class="creative-text">
                        정기 · 창의반
                    </span>

                    · ${cips}

                `;

            } else {

                html += `

                    <br>

                    <span class="recurring-text">
                        정기 · ${escapeHtml(rule.reason)}
                    </span>

                    · ${cips}

                `;
            }
        });


        html += "</div>";


        items.push({
            number: i,
            html: html
        });
    }


    if(items.length === 0) {

        list.textContent =
            "해당 날짜 불참자가 없습니다.";

        return;
    }


    list.innerHTML =
        items
            .sort(
                (a,b) =>
                    a.number - b.number
            )
            .map(
                item => item.html
            )
            .join("");
}


/* ==================================================
   날짜 변경
================================================== */

function changeSelectedDate() {

    let date =
        document
            .getElementById("viewDate")
            .value;


    if(!date) {

        date = getTodayKey();


        document
            .getElementById("viewDate")
            .value = date;
    }


    selectedDate = date;


    const weekday =
        getWeekdayFromDate(
            selectedDate
        );


    document
        .getElementById("dateInfo")
        .textContent =
        `${selectedDate} (${weekdayNames[weekday]}요일)`;


    updateCipInfo();

    startDateSync();
}


/* ==================================================
   대표 화면
================================================== */

async function toggleDisplayMode() {

    displayMode = !displayMode;


    const button =
        document.getElementById(
            "displayModeButton"
        );


    if(displayMode) {

        selectedDate =
            getTodayKey();


        document
            .getElementById("viewDate")
            .value =
            selectedDate;


        startDateSync();


        document.body.classList.add(
            "display-mode"
        );


        button.textContent =
            "신청 화면";


        try {

            if(
                document
                    .documentElement
                    .requestFullscreen
            ) {

                await document
                    .documentElement
                    .requestFullscreen();
            }

        } catch(error) {
        }

    } else {

        document.body.classList.remove(
            "display-mode"
        );


        button.textContent =
            "대표 화면";


        try {

            if(
                document.fullscreenElement &&
                document.exitFullscreen
            ) {

                await document.exitFullscreen();
            }

        } catch(error) {
        }
    }


    updateCipInfo();

    updateScreen();
}

/* ==================================================
   HTML 문자 보호
================================================== */

function escapeHtml(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}
