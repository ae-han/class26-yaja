<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2학년 6반 야자 시트</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: clamp(8px, 1.5vw, 24px);
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f3f5f7;
}

/* =========================
   상단
========================= */

h1 {
    text-align: center;
    font-size: clamp(30px, 3vw, 44px);
    margin: 3px 0 7px;
}

#clock {
    text-align: center;
    font-size: clamp(18px, 2vw, 27px);
    font-weight: 800;
    margin-bottom: 8px;
}

.current-cip {
    max-width: 720px;
    margin: 0 auto 22px;
    padding: 12px 16px;
    border-radius: 10px;
    background: #222;
    color: white;
    text-align: center;
    font-size: clamp(14px, 1.5vw, 19px);
    font-weight: bold;
}


/* =========================
   전체 배치
========================= */

.container {

    width: 100%;
    max-width: 1500px;
    margin: 0 auto;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(285px, 340px);

    gap: clamp(12px, 2vw, 30px);

    align-items: start;
}


/* =========================
   좌석
========================= */

.seat-area {

    background: white;

    padding: clamp(10px, 1.7vw, 23px);

    border-radius: 16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
}

.teacher {

    text-align: center;

    padding: 12px;

    margin-bottom:
        clamp(12px, 1.5vw, 22px);

    background: #333;

    color: white;

    border-radius: 8px;

    font-weight: bold;
}


/* 6 X 6 유지 */

.seat-grid {

    display: grid;

    grid-template-columns:
        repeat(6, minmax(0, 1fr));

    gap:
        clamp(4px, 0.8vw, 11px);
}


.seat {

    width: 100%;

    aspect-ratio: 1 / 0.9;

    min-height: 75px;

    padding: 4px;

    background: #e8f1ff;

    border: 2px solid #7da7e8;

    border-radius: 10px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    overflow: hidden;

    transition: 0.25s;
}


.number {

    font-size:
        clamp(24px, 3vw, 40px);

    font-weight: 900;

    line-height: 1;
}


.name {

    margin-top: 6px;

    font-size:
        clamp(10px, 1.15vw, 16px);

    font-weight: bold;

    white-space: nowrap;
}


.status {

    margin-top: 5px;

    font-size:
        clamp(8px, 0.85vw, 12px);

    font-weight: bold;

    line-height: 1.25;
}


/* 현재 CIP 불참 */

.seat.absent {

    background: #ffd8d8;

    border-color: #e53935;

    color: #a40000;
}


/* 비활성 */

.seat.disabled {

    background: #c8c8c8;

    border-color: #999;

    color: #777;
}


/* =========================
   우측 신청창
========================= */

.control-panel {

    width: 100%;

    background: white;

    padding: 22px;

    border-radius: 16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

    position: sticky;

    top: 10px;
}


.control-panel h2 {

    margin-top: 0;

    font-size: 23px;
}


label {

    display: block;

    font-size: 14px;

    font-weight: bold;
}


input,
textarea,
button {

    width: 100%;

    padding: 11px;

    margin-top: 7px;
    margin-bottom: 15px;

    font-size: 15px;

    border-radius: 8px;

    border: 1px solid #ccc;
}


textarea {

    resize: vertical;

    min-height: 65px;
}


/* =========================
   CIP 버튼
========================= */

.cip-buttons {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 8px;

    margin-bottom: 18px;
}


.cip-btn {

    margin: 0;

    padding: 11px 2px;

    background: #f0f2f4;

    border: 2px solid #ccc;

    color: #333;

    cursor: pointer;

    font-weight: bold;
}


.cip-btn.selected {

    background: #1976d2;

    border-color: #1976d2;

    color: white;
}


.cip-time {

    display: block;

    font-size: 10px;

    margin-top: 3px;

    font-weight: normal;
}


/* =========================
   신청/취소
========================= */

.submit-btn {

    background: #1976d2;

    border: none;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.cancel-btn {

    background: #555;

    border: none;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.message {

    min-height: 23px;

    text-align: center;

    font-weight: bold;
}


/* =========================
   불참자 목록
========================= */

.absence-list {

    border-top: 1px solid #ddd;

    margin-top: 18px;

    padding-top: 13px;
}


.absence-item {

    background: #f5f5f5;

    padding: 8px;

    margin-bottom: 6px;

    border-radius: 6px;

    font-size: 12px;

    line-height: 1.45;
}


/* =========================
   화면 크기 대응
========================= */

@media(max-width: 900px) {

    .container {

        grid-template-columns: 1fr;

    }

    .control-panel {

        position: static;

    }
}


@media(max-width: 550px) {

    body {
        padding: 5px;
    }

    .seat-area {
        padding: 6px;
    }

    .seat-grid {
        gap: 3px;
    }

    .seat {
        min-height: 58px;
        border-width: 1px;
    }

    .number {
        font-size: 19px;
    }

    .name {
        font-size: 8px;
    }

    .status {
        font-size: 7px;
    }

}

</style>
</head>


<body>


<h1>
    2학년 6반
</h1>


<!-- 실시간 -->

<div id="clock">
</div>


<!-- 현재 CIP -->

<div
    id="currentCip"
    class="current-cip">

    현재 시간 확인 중...

</div>



<div class="container">


<!-- ==============================
     좌석
============================== -->

<div class="seat-area">

    <div class="teacher">
        칠판 / 교탁
    </div>

    <div
        id="seatGrid"
        class="seat-grid">
    </div>

</div>



<!-- ==============================
     불참 신청
============================== -->

<div class="control-panel">


<h2>
    🌙 야자 불참 신청
</h2>


<label>
    번호 또는 이름
</label>


<input
    id="studentInput"
    list="studentList"
    type="text"
    autocomplete="off"
    placeholder="예: 23 또는 윤하유"
>


<datalist id="studentList">
</datalist>



<label>
    불참할 CIP 선택
</label>


<div class="cip-buttons">


<button
    type="button"
    class="cip-btn"
    data-cip="1"
    onclick="toggleCip(this)">

    1차

    <span class="cip-time">
        16:50~17:40
    </span>

</button>


<button
    type="button"
    class="cip-btn"
    data-cip="2"
    onclick="toggleCip(this)">

    2차

    <span class="cip-time">
        18:40~20:00
    </span>

</button>


<button
    type="button"
    class="cip-btn"
    data-cip="3"
    onclick="toggleCip(this)">

    3차

    <span class="cip-time">
        20:10~21:00
    </span>

</button>


</div>



<label>
    야자 불참 사유
</label>


<textarea
    id="reason"
    placeholder="예: 학원, 병원, 가족 행사">
</textarea>



<label>
    비밀번호
</label>


<input
    id="password"
    type="password"
    inputmode="numeric"
    maxlength="4"
    placeholder="비밀번호 4자리"
>



<button
    class="submit-btn"
    onclick="applyAbsence()">

    야자 불참 신청

</button>



<button
    class="cancel-btn"
    onclick="cancelAbsence()">

    전체 불참 신청 취소

</button>



<div
    id="message"
    class="message">
</div>



<div class="absence-list">

<h3>
    전체 신청 현황
</h3>

<div id="absenceList">
    없음
</div>

</div>


</div>

</div>



<script>


/* =====================================================
   학생
===================================================== */

const students = {

1:"강주형",
2:"고진용",
3:"권율",
4:"X",
5:"김경태",
6:"김용준",
7:"김제겸",
8:"김지효",
9:"김하윤",
10:"김현성",

11:"목지안",
12:"백시우",
13:"서재훈",
14:"서지후",
15:"성무빈",
16:"송재호",
17:"신예준",
18:"신준모",
19:"양서희",
20:"오태진",

21:"윤수찬",
22:"윤정연",
23:"윤하유",
24:"이지성",
25:"이지혁",
26:"이지후",
27:"전윤우",
28:"정준기",
29:"정하율",
30:"조동현",

31:"차이한",
32:"최담호",
33:"최유진",
34:"최태웅",

35:"X",
36:"X"

};


const disabledStudents = [
    4,
    35,
    36
];



/* =====================================================
   비밀번호
===================================================== */

const passwords = {};

for(let i=1; i<=36; i++){

    passwords[i] = "0000";

}



/* =====================================================
   CIP 시간

   분 단위로 비교
===================================================== */

const cipTimes = {

    1:{
        start:16*60+50,
        end:17*60+40
    },

    2:{
        start:18*60+40,
        end:20*60
    },

    3:{
        start:20*60+10,
        end:21*60
    }

};



/* =====================================================
   선택 CIP
===================================================== */

let selectedCips = [];



/* =====================================================
   신청 데이터
===================================================== */

let absenceData =

JSON.parse(

    localStorage.getItem(
        "class26_absence_v3"
    )

) || {};



/* =====================================================
   현재 CIP
===================================================== */

let currentCip = null;



/* =====================================================
   한국 시간 구하기

   PC가 다른 시간대로 설정되어 있어도
   Asia/Seoul 기준으로 변환
===================================================== */

function getKoreaTimeParts(){


    const formatter =
        new Intl.DateTimeFormat(
            "ko-KR",
            {

                timeZone:
                    "Asia/Seoul",

                year:"numeric",
                month:"2-digit",
                day:"2-digit",

                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",

                hourCycle:"h23"

            }
        );


    const parts =
        formatter.formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            result[part.type] =
                part.value;

        }
    );


    return result;

}



/* =====================================================
   현재 시간으로 CIP 판정
===================================================== */

function calculateCurrentCip(){


    const t =
        getKoreaTimeParts();


    const hour =
        Number(t.hour);


    const minute =
        Number(t.minute);


    const total =
        hour * 60 + minute;



    if(
        total >= cipTimes[1].start &&
        total < cipTimes[1].end
    ){

        return 1;

    }


    if(
        total >= cipTimes[2].start &&
        total < cipTimes[2].end
    ){

        return 2;

    }


    if(
        total >= cipTimes[3].start &&
        total < cipTimes[3].end
    ){

        return 3;

    }


    return null;

}



/* =====================================================
   실시간 시계
===================================================== */

function updateClock(){


    const t =
        getKoreaTimeParts();


    document.getElementById(
        "clock"
    ).textContent =

        `${t.year}.${t.month}.${t.day}  ${t.hour}:${t.minute}:${t.second}`;


    const newCip =
        calculateCurrentCip();


    /*
    CIP가 변경되면
    좌석표도 즉시 변경
    */

    if(
        newCip !== currentCip
    ){

        currentCip =
            newCip;

        updateScreen();

    }


    updateCurrentCipText();

}



/* =====================================================
   상단 현재 CIP 안내
===================================================== */

function updateCurrentCipText(){


    const box =
        document.getElementById(
            "currentCip"
        );


    const t =
        getKoreaTimeParts();


    const total =
        Number(t.hour) * 60 +
        Number(t.minute);



    if(currentCip === 1){

        box.innerHTML =
            "현재 <strong>CIP 1차</strong> 진행 중 · 16:50 ~ 17:40";

        return;

    }


    if(currentCip === 2){

        box.innerHTML =
            "현재 <strong>CIP 2차</strong> 진행 중 · 18:40 ~ 20:00";

        return;

    }


    if(currentCip === 3){

        box.innerHTML =
            "현재 <strong>CIP 3차</strong> 진행 중 · 20:10 ~ 21:00";

        return;

    }



    /* CIP 시작 전 */

    if(total < cipTimes[1].start){

        box.innerHTML =
            "현재 CIP 진행 시간이 아닙니다 · 다음: <strong>CIP 1차 16:50</strong>";

        return;

    }



    /* 1차 후 */

    if(
        total >= cipTimes[1].end &&
        total < cipTimes[2].start
    ){

        box.innerHTML =
            "현재 CIP 쉬는 시간 · 다음: <strong>CIP 2차 18:40</strong>";

        return;

    }



    /* 2차 후 */

    if(
        total >= cipTimes[2].end &&
        total < cipTimes[3].start
    ){

        box.innerHTML =
            "현재 CIP 쉬는 시간 · 다음: <strong>CIP 3차 20:10</strong>";

        return;

    }



    /* 종료 */

    box.innerHTML =
        "오늘의 CIP 시간이 종료되었습니다.";

}



/* =====================================================
   좌석 생성
===================================================== */

function createSeats(){


    const grid =
        document.getElementById(
            "seatGrid"
        );


    for(let i=1; i<=36; i++){


        const seat =
            document.createElement(
                "div"
            );


        seat.id =
            "seat-" + i;


        seat.className =
            "seat";


        if(
            disabledStudents.includes(i)
        ){

            seat.classList.add(
                "disabled"
            );

        }


        seat.innerHTML = `

            <div class="number">
                ${i}
            </div>

            <div class="name">
                ${students[i]}
            </div>

            <div
                class="status"
                id="status-${i}">
            </div>

        `;


        grid.appendChild(
            seat
        );

    }

}



/* =====================================================
   자동완성
===================================================== */

function createStudentList(){


    const list =
        document.getElementById(
            "studentList"
        );


    for(let i=1; i<=36; i++){


        if(
            disabledStudents.includes(i)
        ){

            continue;

        }


        const number =
            document.createElement(
                "option"
            );


        number.value =
            String(i);


        number.label =
            students[i];


        list.appendChild(
            number
        );



        const name =
            document.createElement(
                "option"
            );


        name.value =
            students[i];


        name.label =
            i + "번";


        list.appendChild(
            name
        );

    }

}



/* =====================================================
   CIP 복수 선택
===================================================== */

function toggleCip(button){


    const cip =
        Number(
            button.dataset.cip
        );


    if(
        selectedCips.includes(cip)
    ){


        selectedCips =
            selectedCips.filter(
                x => x !== cip
            );


        button.classList.remove(
            "selected"
        );


    }else{


        selectedCips.push(cip);


        selectedCips.sort(
            (a,b)=>a-b
        );


        button.classList.add(
            "selected"
        );

    }

}



/* =====================================================
   번호 / 이름 찾기
===================================================== */

function findStudent(){


    let input =
        document.getElementById(
            "studentInput"
        ).value.trim();


    input =
        input.replace(
            "번",
            ""
        ).trim();



    if(
        /^\d+$/.test(input)
    ){


        const number =
            Number(input);


        if(
            number >= 1 &&
            number <= 36
        ){

            return number;

        }

    }



    for(let i=1; i<=36; i++){


        if(
            students[i] === input
        ){

            return i;

        }

    }


    return null;

}



/* =====================================================
   신청
===================================================== */

function applyAbsence(){


    const student =
        findStudent();


    const reason =
        document.getElementById(
            "reason"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;



    if(student === null){

        showError(
            "올바른 번호 또는 이름을 입력해주세요."
        );

        return;

    }



    if(
        disabledStudents.includes(
            student
        )
    ){

        showError(
            student +
            "번은 비활성 번호입니다."
        );

        return;

    }



    if(
        selectedCips.length === 0
    ){

        showError(
            "불참할 CIP를 선택해주세요."
        );

        return;

    }



    if(reason === ""){

        showError(
            "불참 사유를 입력해주세요."
        );

        return;

    }



    if(
        password !==
        passwords[student]
    ){

        showError(
            "비밀번호가 틀렸습니다."
        );

        return;

    }



    absenceData[student] = {

        cips:
            [...selectedCips],

        reason:
            reason

    };


    saveData();



    const message =
        document.getElementById(
            "message"
        );


    message.style.color =
        "green";


    message.textContent =

        `${student}번 ${students[student]} 신청 완료`;


    clearInputs();


    updateScreen();

}



/* =====================================================
   전체 불참 신청 취소
===================================================== */

function cancelAbsence(){


    const student =
        findStudent();


    const password =
        document.getElementById(
            "password"
        ).value;



    if(student === null){

        showError(
            "번호 또는 이름을 입력해주세요."
        );

        return;

    }



    if(
        password !==
        passwords[student]
    ){

        showError(
            "비밀번호가 틀렸습니다."
        );

        return;

    }



    if(
        !absenceData[student]
    ){

        showError(
            "등록된 불참 신청이 없습니다."
        );

        return;

    }



    delete absenceData[student];


    saveData();


    document.getElementById(
        "message"
    ).style.color =
        "green";


    document.getElementById(
        "message"
    ).textContent =

        `${student}번 ${students[student]} 신청 취소 완료`;


    clearInputs();


    updateScreen();

}



/* =====================================================
   저장
===================================================== */

function saveData(){


    localStorage.setItem(

        "class26_absence_v3",

        JSON.stringify(
            absenceData
        )

    );

}



/* =====================================================
   좌석 업데이트

   핵심:
   현재 진행 중인 CIP에
   불참 신청한 학생만 빨간색
===================================================== */

function updateScreen(){


    for(let i=1; i<=36; i++){


        const seat =
            document.getElementById(
                "seat-" + i
            );


        const status =
            document.getElementById(
                "status-" + i
            );



        if(
            disabledStudents.includes(i)
        ){

            status.textContent =
                "비활성";

            continue;

        }



        seat.classList.remove(
            "absent"
        );


        status.innerHTML =
            "";



        /*
        현재 CIP 시간이 아닐 경우
        좌석은 기본 상태
        */

        if(currentCip === null){

            continue;

        }



        /*
        학생에게 신청 기록이 있는지
        */

        if(!absenceData[i]){

            continue;

        }



        /*
        현재 CIP를 빠지는 학생인지
        */

        if(
            absenceData[i]
                .cips
                .includes(
                    currentCip
                )
        ){


            seat.classList.add(
                "absent"
            );


            status.innerHTML =

                `CIP ${currentCip}차 불참`
                +
                "<br>"
                +
                escapeHtml(
                    absenceData[i].reason
                );

        }

    }


    updateAbsenceList();

}



/* =====================================================
   전체 신청 목록
===================================================== */

function updateAbsenceList(){


    const list =
        document.getElementById(
            "absenceList"
        );


    const numbers =
        Object.keys(
            absenceData
        );


    if(numbers.length === 0){

        list.innerHTML =
            "없음";

        return;

    }



    numbers.sort(
        (a,b)=>
        Number(a)-Number(b)
    );


    list.innerHTML =
        "";


    numbers.forEach(
        number => {


            const data =
                absenceData[number];


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "absence-item";


            const cips =
                data.cips
                    .map(
                        n =>
                            `CIP ${n}차`
                    )
                    .join(" · ");


            item.innerHTML =

                `<strong>
                ${number}번
                ${students[number]}
                </strong>

                <br>

                ${cips}

                <br>

                ${escapeHtml(
                    data.reason
                )}`;


            list.appendChild(
                item
            );

        }
    );

}

/* =====================================================
   오류
===================================================== */

function showError(text){


    const message =
        document.getElementById(
            "message"
        );


    message.style.color =
        "red";


    message.textContent =
        text;

}



/* =====================================================
   HTML 보호
===================================================== */

function escapeHtml(text){


    return String(text)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
