<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>2학년 6반 야자 관리</title>

<style>

* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    padding: clamp(6px, 1.5vw, 24px);

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #f3f5f7;
    color: #222;
}

/* ===============================
   상단
=============================== */

h1 {
    margin: 5px 0;
    text-align: center;

    font-size:
        clamp(28px, 3.2vw, 44px);
}

#clock {
    text-align: center;

    font-weight: 800;

    font-size:
        clamp(17px, 2vw, 27px);

    margin-bottom: 8px;
}

.current-cip {
    max-width: 760px;

    margin:
        0 auto
        clamp(12px, 2vw, 20px);

    padding: 12px;

    background: #252525;
    color: white;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

    font-size:
        clamp(13px, 1.4vw, 18px);
}


/* ===============================
   전체
=============================== */

.container {

    width: 100%;
    max-width: 1500px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(290px, 360px);

    gap:
        clamp(12px, 2vw, 30px);

    align-items: start;
}


/* ===============================
   좌석
=============================== */

.seat-area {

    min-width: 0;

    background: white;

    padding:
        clamp(8px, 1.6vw, 22px);

    border-radius: 15px;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,0.08);
}

.teacher {

    background: #333;
    color: white;

    border-radius: 8px;

    padding: 12px;

    text-align: center;

    font-weight: bold;

    margin-bottom:
        clamp(10px, 1.5vw, 20px);
}

.seat-grid {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(6, minmax(0,1fr));

    gap:
        clamp(3px, 0.7vw, 10px);
}

.seat {

    min-width: 0;

    width: 100%;

    aspect-ratio: 1 / 0.95;

    min-height: 70px;

    padding:
        clamp(2px, 0.5vw, 6px);

    background: #e8f1ff;

    border:
        2px solid #7da7e8;

    border-radius: 9px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    overflow: hidden;

    transition: 0.2s;
}

.number {

    font-size:
        clamp(21px, 3vw, 40px);

    font-weight: 900;

    line-height: 1;
}

.name {

    margin-top: 5px;

    font-size:
        clamp(8px, 1.15vw, 16px);

    font-weight: bold;

    white-space: nowrap;
}

.status {

    margin-top: 4px;

    max-width: 100%;

    font-size:
        clamp(7px, 0.8vw, 12px);

    line-height: 1.25;

    font-weight: bold;

    overflow-wrap: anywhere;
}


/* 불참 */

.seat.absent {

    background: #ffd9d9;

    border-color: #e53935;

    color: #950000;
}


/* 반복 불참 */

.seat.recurring {

    background: #ffe7c2;

    border-color: #e28a00;

    color: #8b4c00;
}


/* 일반 + 반복 모두 */

.seat.both {

    background: #f3d7ff;

    border-color: #8e44ad;

    color: #5d176f;
}


/* 비활성 */

.seat.disabled {

    background: #c9c9c9;

    border-color: #999;

    color: #777;
}


/* ===============================
   패널
=============================== */

.control-panel {

    min-width: 0;

    width: 100%;

    background: white;

    padding:
        clamp(16px, 2vw, 23px);

    border-radius: 15px;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,0.08);

    position: sticky;

    top: 10px;
}

.control-panel h2 {

    margin: 0 0 15px;

    font-size:
        clamp(20px, 2vw, 25px);
}

.section-title {

    margin:
        22px 0 10px;

    padding-top: 18px;

    border-top:
        2px solid #eee;

    font-size: 17px;

    font-weight: 900;
}

label {

    display: block;

    font-weight: bold;

    font-size: 14px;

    margin-top: 4px;
}

input,
textarea,
button {

    width: 100%;

    min-height: 44px;

    padding: 11px;

    margin-top: 7px;
    margin-bottom: 15px;

    border-radius: 8px;

    border: 1px solid #ccc;

    font-family: inherit;

    font-size: 16px;
}

textarea {

    min-height: 70px;

    resize: vertical;
}


/* ===============================
   날짜
=============================== */

.date-box {

    padding: 12px;

    margin-bottom: 18px;

    border-radius: 10px;

    background: #f5f7fa;
}

.date-box input {
    margin-bottom: 4px;
}

.date-info {

    text-align: center;

    font-size: 13px;

    font-weight: bold;

    color: #555;
}


/* ===============================
   CIP 버튼
=============================== */

.cip-buttons,
.weekday-buttons {

    display: grid;

    gap: 7px;

    margin-top: 8px;

    margin-bottom: 18px;
}

.cip-buttons {
    grid-template-columns:
        repeat(3, minmax(0,1fr));
}

.weekday-buttons {
    grid-template-columns:
        repeat(4, minmax(0,1fr));
}

.cip-btn,
.weekday-btn {

    margin: 0;

    min-width: 0;

    padding: 9px 3px;

    background: #f1f3f5;

    color: #333;

    border: 2px solid #ccc;

    font-weight: bold;

    cursor: pointer;
}

.cip-btn.selected {

    background: #1976d2;

    border-color: #1976d2;

    color: white;
}

.weekday-btn.selected {

    background: #e67e22;

    border-color: #e67e22;

    color: white;
}

.cip-time {

    display: block;

    margin-top: 3px;

    font-size: 9px;

    font-weight: normal;
}


/* ===============================
   버튼
=============================== */

.submit-btn {

    background: #1976d2;

    color: white;

    border: 0;

    font-weight: bold;

    cursor: pointer;
}

.recurring-submit {

    background: #e67e22;

    color: white;

    border: 0;

    font-weight: bold;

    cursor: pointer;
}

.cancel-btn {

    background: #555;

    color: white;

    border: 0;

    font-weight: bold;

    cursor: pointer;
}

.recurring-cancel {

    background: #795548;

    color: white;

    border: 0;

    font-weight: bold;

    cursor: pointer;
}


/* ===============================
   상태
=============================== */

.connection-status {

    margin-bottom: 15px;

    padding: 8px;

    border-radius: 7px;

    text-align: center;

    font-size: 12px;

    font-weight: bold;

    background: #eee;
}

.connection-status.online {

    background: #ddf5e3;

    color: #176b2d;
}

.connection-status.error {

    background: #ffe0e0;

    color: #9b0000;
}

.message {

    min-height: 24px;

    text-align: center;

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 7px;
}


/* ===============================
   명단
=============================== */

.absence-list {

    margin-top: 18px;

    border-top:
        1px solid #ddd;

    padding-top: 13px;
}

.absence-item {

    margin-bottom: 7px;

    padding: 9px;

    border-radius: 7px;

    background: #f5f5f5;

    font-size: 12px;

    line-height: 1.5;
}

.recurring-label {

    color: #b55b00;

    font-weight: bold;
}


/* ===============================
   태블릿
=============================== */

@media(max-width: 900px) {

    .container {
        grid-template-columns: 1fr;
    }

    .control-panel {
        position: static;
    }
}


/* ===============================
   휴대폰
=============================== */

@media(max-width: 600px) {

    body {
        padding: 5px;
    }

    .seat-area {
        padding: 6px;
    }

    .seat-grid {
        gap: 3px;
    }

    .seat {

        min-height: 55px;

        border-width: 1px;

        border-radius: 5px;

        padding: 1px;
    }

    .number {

        font-size:
            clamp(17px, 6vw, 25px);
    }

    .name {

        font-size:
            clamp(7px, 2.4vw, 10px);
    }

    .status {

        font-size:
            clamp(6px, 2vw, 9px);
    }

    .control-panel {
        padding: 15px;
    }
}

</style>
</head>

/* ===================================================

=================================================== */

const cipTimes = {

    1:{
        start:
            16*60+50,

        end:
            17*60+40
    },

    2:{
        start:
            18*60+40,

        end:
            20*60
    },

    3:{
        start:
            20*60+10,

        end:
            21*60
    }

};


const weekdayNames = {

    0:"일",
    1:"월",
    2:"화",
    3:"수",
    4:"목",
    5:"금",
    6:"토"

};



let singleCips = [];

let recurringCips = [];

let recurringDays = [];


/*
선택한 날짜의 일회성 불참
*/

let singleAbsenceData = {};


/*
전체 반복 불참 설정
*/

let recurringData = {};


let currentCip = null;

let selectedDate = "";

let unsubscribeSingle = null;

let unsubscribeRecurring = null;



/* ===================================================
   한국시간
=================================================== */

function getKoreaTimeParts(){


    const formatter =
        new Intl.DateTimeFormat(

            "ko-KR",

            {

                timeZone:
                    "Asia/Seoul",

                year:"numeric",
                month:"2-digit",
                day:"2-digit",

                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",

                hourCycle:"h23"

            }

        );


    const parts =
        formatter
            .formatToParts(
                new Date()
            );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type !==
                "literal"
            ){

                result[
                    part.type
                ] =
                    part.value;

            }

        }
    );


    return result;

}



function getTodayKey(){


    const t =
        getKoreaTimeParts();


    return (

        t.year +
        "-" +
        t.month +
        "-" +
        t.day

    );

}



/* ===================================================
   날짜 → 요일
=================================================== */

function getWeekdayFromDate(
    dateString
){


    const parts =
        dateString
            .split("-")
            .map(Number);


    const date =
        new Date(

            Date.UTC(
                parts[0],
                parts[1]-1,
                parts[2]
            )

        );


    return date.getUTCDay();

}



/* ===================================================
   CIP 시간
=================================================== */

function calculateCurrentCip(){


    const t =
        getKoreaTimeParts();


    const total =

        Number(t.hour)*60
        +
        Number(t.minute);



    if(

        total >=
        cipTimes[1].start

        &&

        total <
        cipTimes[1].end

    ){

        return 1;

    }



    if(

        total >=
        cipTimes[2].start

        &&

        total <
        cipTimes[2].end

    ){

        return 2;

    }



    if(

        total >=
        cipTimes[3].start

        &&

        total <
        cipTimes[3].end

    ){

        return 3;

    }



    return null;

}



/* ===================================================
   시계
=================================================== */

function updateClock(){


    const t =
        getKoreaTimeParts();


    document
        .getElementById(
            "clock"
        )
        .textContent =

        `${t.year}.${t.month}.${t.day} ${t.hour}:${t.minute}:${t.second}`;


    const newCip =
        calculateCurrentCip();


    if(
        newCip !==
        currentCip
    ){

        currentCip =
            newCip;

        updateScreen();

    }


    updateCipInfo();

}



/* ===================================================
   CIP 안내
=================================================== */

function updateCipInfo(){


    const box =
        document.getElementById(
            "currentCip"
        );


    /*
    다른 날짜 조회 중
    */

    if(
        selectedDate !==
        getTodayKey()
    ){

        const day =
            getWeekdayFromDate(
                selectedDate
            );


        box.innerHTML =

            `<strong>
            ${selectedDate}
            (${weekdayNames[day]})
            </strong>
            불참 현황 조회 중`;

        return;

    }


    const t =
        getKoreaTimeParts();


    const total =

        Number(t.hour)*60
        +
        Number(t.minute);


    if(currentCip === 1){

        box.innerHTML =
            "현재 <strong>CIP 1차</strong> 진행 중 · 16:50~17:40";

        return;

    }


    if(currentCip === 2){

        box.innerHTML =
            "현재 <strong>CIP 2차</strong> 진행 중 · 18:40~20:00";

        return;

    }


    if(currentCip === 3){

        box.innerHTML =
            "현재 <strong>CIP 3차</strong> 진행 중 · 20:10~21:00";

        return;

    }


    if(
        total <
        cipTimes[1].start
    ){

        box.innerHTML =
            "현재 CIP 전 · 다음: <strong>1차 16:50</strong>";

        return;

    }


    if(

        total >=
        cipTimes[1].end

        &&

        total <
        cipTimes[2].start

    ){

        box.innerHTML =
            "쉬는 시간 · 다음: <strong>2차 18:40</strong>";

        return;

    }


    if(

        total >=

        total <
        cipTimes[3].start

    ){

        box.innerHTML =
            "쉬는 시간 · 다음: <strong>3차 20:10</strong>";

        return;

    }

        "오늘의 CIP 시간이 종료되었습니다.";

/* ===================================================
   학생 찾기
=================================================== */

function findStudent(){


    let input =
        document
            .getElementById(
                "studentInput"
            )
            .value
            .trim();


    input =
        input
            .replace(
                "번",
                ""
            )
            .trim();


    if(
        /^\d+$/
            .test(input)
    ){


        const number =
            Number(input);


        if(

            number >= 1

            &&

            number <= 36

        ){

            return number;

        }

    }


    for(
        let i=1;
        i<=36;
        i++
    ){


        if(
            students[i] ===
            input
        ){

            return i;

        }

    }


    return null;

}



/* ===================================================
   버튼 선택
=================================================== */

function toggleArrayValue(
    array,
    value
){


    if(
        array.includes(value)
    ){

        return array.filter(
            x =>
                x !== value
        );

    }


    return [
        ...array,
        value
    ].sort(
        (a,b)=>a-b
    );

}

                        }else{

async function applySingleAbsence(){


    const student =
        findStudent();


    const reason =
        document
            .getElementById(
                "singleReason"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    if(student === null){

        showError(
            "올바른 번호 또는 이름을 입력해주세요."
        );

        return;
    }


    if(
        disabledStudents
            .includes(student)
    ){

        showError(
            "비활성 번호입니다."
        );

        return;
    }


    if(
        singleCips.length === 0
    ){

        showError(
            "CIP를 선택해주세요."
        );

        return;
    }


    if(reason === ""){

        showError(
            "불참 사유를 입력해주세요."
        );

        return;
    }


    if(
        password !==
        passwords[student]
    ){

        showError(
            "비밀번호가 틀렸습니다."
        );

        return;
    }


    const documentId =

        selectedDate
        +
        "_"
        +
        student;


    try{


        await setDoc(

            doc(
                db,
                "absence",
                documentId
            ),

            {

                date:
                    selectedDate,

                number:
                    student,

                name:
                    students[student],

                cips:
                    [...singleCips],

                reason:
                    reason,

                updatedAt:
                    serverTimestamp()

            }

        );


        showSuccess(

            `${selectedDate} · ${student}번 ${students[student]} 신청 완료`

        );


        clearSingleInput();


    }catch(error){


        console.error(error);


        showError(
            "날짜별 신청 저장 실패"
        );

    }

}

/* ===================================================
   선택 날짜 Firestore 실시간 조회
=================================================== */

function startDateSync(){


    if(unsubscribeSingle){

        unsubscribeSingle();

    }


    const q =
        query(

            collection(
                db,
                "absence"
            ),

            where(
                "date",
                "==",
                selectedDate
            )

        );


    unsubscribeSingle =
        onSnapshot(

            q,

            snapshot => {


                singleAbsenceData = {};


                snapshot.forEach(
                    document => {


                        const data =
                            document.data();


                        singleAbsenceData[
                            data.number
                        ] = {

                            cips:
                                data.cips,

                            reason:
                                data.reason

                        };

                    }
                );


                updateScreen();


                setConnectionStatus(
                    "실시간 공유 연결됨",
                    "online"
                );

            },

            error => {


                console.error(error);


                setConnectionStatus(
                    "Firebase 연결 오류",
                    "error"
                );

            }

        );

}



/* ===================================================
   반복 데이터 실시간 조회
=================================================== */

function startRecurringSync(){


    if(unsubscribeRecurring){

        unsubscribeRecurring();

    }


    unsubscribeRecurring =
        onSnapshot(

            collection(
                db,
                "recurring"
            ),

            snapshot => {


                recurringData = {};


                snapshot.forEach(
                    document => {


                        const data =
                            document.data();


                        recurringData[
                            data.number
                        ] = {

                            weekdays:
                                data.weekdays || [],

                            cips:
                                data.cips || [],

                            reason:
                                data.reason || ""

                        };

                    }
                );


                updateScreen();

            }

        );

}



/* ===================================================
   선택 날짜에 반복 불참 적용되는지 확인
=================================================== */

function getRecurringForStudent(
    student
){


    const recurring =
        recurringData[student];


    if(!recurring){

        return null;
    }


    const weekday =
        getWeekdayFromDate(
            selectedDate
        );


    if(
        !recurring.weekdays
            .includes(
                weekday
            )
    ){

        return null;
    }


    return recurring;

}



/* ===================================================
   화면
=================================================== */

function updateScreen(){


    const weekday =
        getWeekdayFromDate(
            selectedDate
        );


    const today =
        getTodayKey();


    for(
        let i=1;
        i<=36;
        i++
    ){


        const seat =
            document.getElementById(
                "seat-" + i
            );


        const status =
            document.getElementById(
                "status-" + i
            );


        if(
            disabledStudents
                .includes(i)
        ){

            status.textContent =
                "비활성";

            continue;
        }


        seat.classList.remove(
            "absent",
            "recurring",
            "both"
        );


        status.innerHTML =
            "";


        const single =
            singleAbsenceData[i];


        const recurring =
            getRecurringForStudent(
                i
            );


        /*
        오늘 날짜에서는
        현재 CIP만 표시.

        다른 날짜 조회 시에는
        전체 신청을 보여줌.
        */

        let singleVisible =
            false;


        let recurringVisible =
            false;


        if(
            selectedDate ===
            today
        ){


            if(currentCip !== null){


                singleVisible =
                    !!single
                    &&
                    single.cips
                        .includes(
                            currentCip
                        );


                recurringVisible =
                    !!recurring
                    &&
                    recurring.cips
                        .includes(
                            currentCip
                        );

            }


        }else{


            singleVisible =
                !!single;


            recurringVisible =
                !!recurring;

        }



        if(
            singleVisible
            &&
            recurringVisible
        ){

            seat.classList.add(
                "both"
            );

        }
        else if(singleVisible){

            seat.classList.add(
                "absent"
            );

        }
        else if(recurringVisible){

            seat.classList.add(
                "recurring"
            );

        }



        const lines = [];


        if(singleVisible){


            const cipText =
                single.cips
                    .map(
                        c =>
                            `${c}차`
                    )
                    .join("·");


            lines.push(

                `${cipText} ${escapeHtml(single.reason)}`

            );

        }


        if(recurringVisible){


            const cipText =
                recurring.cips
                    .map(
                        c =>
                            `${c}차`
                    )
                    .join("·");


            lines.push(

                `<span class="recurring-label">(${weekdayNames[weekday]})</span>
                 ${cipText}
                 ${escapeHtml(recurring.reason)}`

            );

        }


        status.innerHTML =
            lines.join("<br>");

    }


    updateAbsenceList();

}



/* ===================================================
   오른쪽 명단
=================================================== */

function updateAbsenceList(){


    const list =
        document.getElementById(
            "absenceList"
        );


    const weekday =
        getWeekdayFromDate(
            selectedDate
        );


    document
        .getElementById(
            "listTitle"
        )
        .textContent =

        `${selectedDate} (${weekdayNames[weekday]}) 불참 현황`;


    const items = [];


    for(
        let i=1;
        i<=36;
        i++
    ){


        if(
            disabledStudents
                .includes(i)
        ){

            continue;
        }


        const single =
            singleAbsenceData[i];


        const recurring =
            getRecurringForStudent(
                i
            );


        if(
            !single
            &&
            !recurring
        ){

            continue;
        }


        const parts = [];


        if(single){


            const cips =
                single.cips
                    .map(
                        c =>
                            `CIP ${c}차`
                    )
                    .join(" · ");


            parts.push(

                `${cips}<br>${escapeHtml(single.reason)}`

            );

        }


        if(recurring){


            const cips =
                recurring.cips
                    .map(
                        c =>
                            `CIP ${c}차`
                    )
                    .join(" · ");


            parts.push(

                `<span class="recurring-label">
                (${weekdayNames[weekday]}) 반복
                </span>
                ${cips}
                <br>
                ${escapeHtml(recurring.reason)}`

            );

        }


        items.push({

            number:i,

            html:

                `<div class="absence-item">

                    <strong>
                        ${i}번 ${students[i]}
                    </strong>

                    <br>

                    ${parts.join("<hr>")}

                </div>`

        });

    }


    if(
        items.length === 0
    ){

        list.textContent =
            "해당 날짜 불참자가 없습니다.";

        return;

    }


    list.innerHTML =

        items
            .sort(
                (a,b)=>
                    a.number -
                    b.number
            )
            .map(
                item =>
                    item.html
            )
            .join("");

}

/* ===================================================
   HTML 보호
=================================================== */

function escapeHtml(text){


    return String(text)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}
